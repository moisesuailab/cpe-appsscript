<template x-if="currentView === 'magistrados' && canAdmin()">
<div class="main-content" x-cloak>
  <div class="space-y-5">

    <!-- Cabeçalho -->
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <p x-show="composicaoUltimaConsulta" class="text-xs text-text-muted flex items-center gap-1.5">
          <i data-lucide="clock" class="w-3 h-3"></i>
          Atualizado em: <span x-text="composicaoUltimaConsulta"></span>
        </p>
      </div>
      <div class="flex flex-wrap gap-2 w-full sm:w-auto">
        <button class="btn-outline flex-1 sm:flex-none justify-center" @click="loadComposicao()">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Atualizar
        </button>
        <template x-if="canAdmin()">
          <button class="btn-primary flex-1 sm:flex-none justify-center" @click="openAddMagistrado()">
            <i data-lucide="plus" class="w-4 h-4"></i>
            Novo Magistrado
          </button>
        </template>
      </div>
    </div>

    <!-- Filtro -->
    <div class="card px-5 py-4">
      <div class="relative">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-text-muted pointer-events-none"></i>
        <input type="text"
               x-model="magistradoSearch"
               placeholder="Buscar por nome ou matrícula..."
               class="form-input pl-9 w-full" />
      </div>
    </div>

    <!-- Card principal -->
    <div class="card overflow-hidden">

      <div class="overflow-x-auto">
        <table class="w-full border-collapse">

          <!-- Cabeçalho -->
          <thead>
            <tr class="bg-bg-light border-b border-border">

              <!-- Nome (sortável) -->
              <th class="px-5 py-3.5 text-left">
                <button class="flex items-center gap-1 group"
                        @click="magistradosSortBy === 'nome' ? magistradosSortDir = (magistradosSortDir === 'asc' ? 'desc' : 'asc') : (magistradosSortBy = 'nome', magistradosSortDir = 'asc')"
                        :title="magistradosSortBy === 'nome' ? (magistradosSortDir === 'asc' ? 'Ordenado por nome A→Z. Clique para inverter.' : 'Ordenado por nome Z→A. Clique para inverter.') : 'Clique para ordenar por nome'">
                  <span class="text-xs font-semibold text-text-muted uppercase tracking-wide group-hover:text-primary transition-colors">Nome</span>
                  <i class="w-3 h-3 text-text-muted group-hover:text-primary transition-colors"
                     :data-lucide="magistradosSortBy === 'nome' ? (magistradosSortDir === 'asc' ? 'arrow-up' : 'arrow-down') : 'arrow-up-down'"></i>
                </button>
              </th>

              <!-- Matrícula -->
              <th class="px-5 py-3.5 text-left w-36 hidden sm:table-cell">
                <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Matrícula</span>
              </th>

              <!-- Cidade -->
              <th class="px-5 py-3.5 text-left w-40 hidden md:table-cell">
                <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Cidade</span>
              </th>

              <!-- Ações -->
              <th class="px-5 py-3.5 text-right w-20">
                <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Ações</span>
              </th>

            </tr>
          </thead>

          <!-- Body -->
          <tbody class="divide-y divide-border">

            <!-- Estado vazio -->
            <template x-if="magistradosFiltrados.length === 0">
              <tr>
                <td colspan="4" class="py-16 text-center">
                  <div class="w-12 h-12 rounded-2xl bg-bg-medium flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="scale" class="w-6 h-6 text-text-muted"></i>
                  </div>
                  <p class="text-text-muted text-sm">Nenhum magistrado encontrado.</p>
                </td>
              </tr>
            </template>

            <!-- Linhas -->
            <template x-for="m in magistradosPaged" :key="m.id">
              <tr class="hover:bg-bg-light transition-colors">

                <!-- Nome -->
                <td class="px-5 py-3.5">
                  <p class="text-sm font-medium text-text-main truncate" x-text="m.nome"></p>
                  <!-- Mobile: matrícula abaixo do nome -->
                  <p class="text-xs text-text-muted font-mono mt-0.5 sm:hidden" x-text="m.matricula || '—'"></p>
                </td>

                <!-- Matrícula -->
                <td class="px-5 py-3.5 w-36 hidden sm:table-cell">
                  <p class="text-sm text-text-muted font-mono" x-text="m.matricula || '—'"></p>
                </td>

                <!-- Cidade -->
                <td class="px-5 py-3.5 w-40 hidden md:table-cell">
                  <p class="text-sm text-text-muted truncate" x-text="m.cidade || '—'"></p>
                </td>

                <!-- Ações -->
                <td class="px-5 py-3.5 w-20">
                  <div class="flex items-center gap-1 justify-end">
                    <template x-if="canAdmin()">
                      <span class="flex items-center gap-1">
                        <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center
                                       text-text-muted hover:border-primary hover:text-primary transition-all"
                                @click="openEditMagistrado(m)" title="Editar magistrado">
                          <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center transition-all"
                                :class="ocupacoes.some(o => o.id_magistrado === m.id)
                                  ? 'opacity-30 cursor-not-allowed text-text-muted'
                                  : 'text-text-muted hover:border-red-300 hover:text-red-500'"
                                :disabled="ocupacoes.some(o => o.id_magistrado === m.id)"
                                :title="ocupacoes.some(o => o.id_magistrado === m.id) ? 'Magistrado possui ocupações vinculadas' : 'Excluir magistrado'"
                                @click="!ocupacoes.some(o => o.id_magistrado === m.id) && deleteMagistrado(m)">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      </span>
                    </template>
                  </div>
                </td>

              </tr>
            </template>

          </tbody>
        </table>
      </div>

      <!-- Rodapé com paginação -->
      <div class="px-5 py-3 border-t border-border flex flex-col sm:flex-row items-center justify-between gap-3"
           x-show="magistradosFiltrados.length > 0">
        <div class="flex items-center gap-2 text-xs text-text-muted">
          <strong x-text="magistradosFiltrados.length"></strong>
          <span x-text="magistradosFiltrados.length === 1 ? 'registro' : 'registros'"></span>
          <span class="text-border">·</span>
          <span>Exibindo</span>
          <select x-model.number="magistradosPerPage"
                  @change="magistradosPage = 1"
                  class="select-input text-xs py-1 px-2 w-16">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
          <span>por página</span>
        </div>
        <div class="flex items-center gap-1">
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="magistradosPage === 1" @click="magistradosPage = 1" title="Primeira página">
            <i data-lucide="chevrons-left" class="w-3.5 h-3.5"></i>
          </button>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="magistradosPage === 1" @click="magistradosPage--" title="Anterior">
            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
          </button>
          <span class="text-xs text-text-muted px-2">
            <strong x-text="magistradosPage"></strong> / <strong x-text="magistradosTotalPages"></strong>
          </span>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="magistradosPage === magistradosTotalPages" @click="magistradosPage++" title="Próxima">
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </button>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="magistradosPage === magistradosTotalPages" @click="magistradosPage = magistradosTotalPages" title="Última">
            <i data-lucide="chevrons-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
</template>
