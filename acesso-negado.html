<!doctype html>
<html lang="pt-BR">
  <head>
    <base target="_top">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso Negado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    
    <div class="max-w-md w-full">
      <div class="bg-white rounded-lg shadow-xl border border-gray-200 overflow-hidden">
        
        <div class="bg-gradient-to-r from-red-50 to-orange-50 px-6 py-8 text-center border-b border-red-100">
          <div class="inline-flex items-center justify-center w-16 h-16 bg-red-100 rounded-full mb-4">
            <i data-lucide="shield-alert" class="w-8 h-8 text-red-600"></i>
          </div>
          <h1 class="text-2xl font-bold text-gray-900 mb-2">Acesso Restrito</h1>
          <p class="text-sm text-gray-600">Esta área é exclusiva para usuários autorizados</p>
        </div>
        
        <div class="px-6 py-6">
          <div class="mb-6">            
            <div class="flex items-start gap-3">
              <i data-lucide="info" class="w-5 h-5 text-blue-600 flex-shrink-0 mt-0.5"></i>
              <div>
                <h3 class="text-sm font-semibold text-gray-900 mb-1">Por que estou vendo isso?</h3>
                <p class="text-sm text-gray-600">Seu e-mail não está cadastrado na lista de usuários autorizados para acessar esta ferramenta.</p>
              </div>
            </div>
          </div>
        </div>
        
        <div class="px-6 py-4 bg-gray-50 border-t border-gray-200">
          <p class="text-xs text-center text-gray-500">
            Se você acredita que deveria ter acesso, entre em contato com o administrador da ferramenta <strong><?= appName ?></strong>.
          </p>
        </div>        
      </div>
    </div>
    
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
