<div class="main-content" x-show="currentView === 'vagas'" x-cloak>
  <div class="space-y-5">

    <!-- Cabeçalho -->
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <p x-show="vagasUltimaConsulta" class="text-xs text-text-muted flex items-center gap-1.5">
          <i data-lucide="clock" class="w-3 h-3"></i>
          Atualizado em: <span x-text="vagasUltimaConsulta"></span>
        </p>
      </div>
      <div class="flex flex-wrap gap-2 w-full sm:w-auto">
        <button class="btn-outline flex-1 sm:flex-none justify-center" @click="loadVagas()">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Atualizar
        </button>
        <template x-if="canEdit()">
          <button class="btn-primary flex-1 sm:flex-none justify-center" @click="openAddVaga()">
            <i data-lucide="plus" class="w-4 h-4"></i>
            Nova Vaga
          </button>
        </template>
      </div>
    </div>

    <!-- Filtro -->
    <div class="card px-5 py-4">
      <div class="relative">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-text-muted pointer-events-none"></i>
        <input type="text"
               x-model="vagasSearch"
               placeholder="Buscar por código (ex: CPE001)..."
               class="form-input pl-9 w-full" />
      </div>
    </div>

    <!-- Card principal -->
    <div class="card overflow-hidden">

      <!-- Cabeçalhos de coluna -->
      <div class="px-5 py-4 bg-bg-light hidden sm:flex items-center gap-3">
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-24">Código</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-28 hidden md:block">Tipo</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-28 hidden md:block">Status</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide flex-1">Lotação</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-40 hidden lg:block">Estagiário</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-28 text-right pr-1">Ações</p>
      </div>

      <!-- Tabela -->
      <div class="divide-y divide-border">
        <template x-if="vagasFiltradas.length === 0">
          <div class="py-16 text-center">
            <div class="w-12 h-12 rounded-2xl bg-bg-medium flex items-center justify-center mx-auto mb-3">
              <i data-lucide="briefcase" class="w-6 h-6 text-text-muted"></i>
            </div>
            <p class="text-text-muted text-sm">Nenhuma vaga encontrada.</p>
          </div>
        </template>
        <template x-for="v in vagasPaged" :key="v.id">
          <div class="px-5 py-3.5 flex items-center gap-3 hover:bg-bg-light transition-colors">
            <!-- Código -->
            <div class="w-24 flex-shrink-0">
              <p class="text-sm font-semibold text-text-main font-mono" x-text="vagaCodigo(v)"></p>
            </div>
            <!-- Tipo -->
            <div class="w-28 flex-shrink-0 hidden md:block">
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium"
                    :class="{
                      'bg-blue-50 text-blue-700': v.tipo_vaga === 'graduacao',
                      'bg-purple-50 text-purple-700': v.tipo_vaga === 'pos_graduacao',
                      'bg-gray-100 text-gray-600': v.tipo_vaga === 'indefinido'
                    }"
                    x-text="vagaTipoLabel(v.tipo_vaga)">
              </span>
            </div>
            <!-- Status -->
            <div class="w-28 flex-shrink-0 hidden md:block">
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium"
                    :class="{
                      'bg-green-50 text-green-700': v.status === 'alocada',
                      'bg-yellow-50 text-yellow-700': v.status === 'nao_alocada'
                    }"
                    x-text="v.status === 'alocada' ? 'Alocada' : 'Não alocada'">
              </span>
            </div>
            <!-- Lotação -->
            <div class="flex-1 min-w-0">
              <template x-if="!vagaLotacao(v)">
                <p class="text-sm text-text-muted">—</p>
              </template>
              <template x-if="vagaLotacao(v)">
                <div>
                  <p class="text-sm font-medium text-text-main truncate" x-text="vagaLotacao(v).linha1"></p>
                  <p class="text-xs text-text-muted truncate" x-show="vagaLotacao(v).linha2" x-text="vagaLotacao(v).linha2"></p>
                </div>
              </template>
            </div>
            <!-- Estagiário -->
            <div class="w-40 flex-shrink-0 min-w-0 hidden lg:block">
              <p class="text-sm text-text-muted truncate" x-text="vagaEstagiario(v) || '—'"></p>
            </div>
            <!-- Ações -->
            <div class="flex items-center gap-1 flex-shrink-0 w-28 justify-end">
              <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center
                             text-text-muted hover:border-primary hover:text-primary transition-all"
                      @click="openViewVaga(v)" title="Visualizar vaga">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
              <template x-if="canEdit()">
                <span class="flex items-center gap-1">
                  <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center
                                 text-text-muted hover:border-primary hover:text-primary transition-all"
                          @click="openEditVaga(v)" title="Editar vaga">
                    <i data-lucide="pencil" class="w-4 h-4"></i>
                  </button>
                  <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center transition-all"
                          :class="vagaTemContrato(v)
                            ? 'opacity-30 cursor-not-allowed text-text-muted'
                            : 'text-text-muted hover:border-red-300 hover:text-red-500'"
                          :disabled="vagaTemContrato(v)"
                          :title="vagaTemContrato(v) ? 'Vaga possui contratos vinculados' : 'Excluir vaga'"
                          @click="!vagaTemContrato(v) && deleteVaga(v)">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </span>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- Rodapé com paginação -->
      <div class="px-5 py-3 border-t border-border flex flex-col sm:flex-row items-center justify-between gap-3"
           x-show="vagasFiltradas.length > 0">
        <div class="flex items-center gap-2 text-xs text-text-muted">
          <strong x-text="vagasFiltradas.length"></strong>
          <span x-text="vagasFiltradas.length === 1 ? 'registro' : 'registros'"></span>
          <span class="text-border">·</span>
          <span>Exibindo</span>
          <select x-model.number="vagasPerPage"
                  @change="vagasPage = 1"
                  class="select-input text-xs py-1 px-2 w-16">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
          <span>por página</span>
        </div>
        <div class="flex items-center gap-1">
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="vagasPage === 1" @click="vagasPage = 1" title="Primeira página">
            <i data-lucide="chevrons-left" class="w-3.5 h-3.5"></i>
          </button>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="vagasPage === 1" @click="vagasPage--" title="Anterior">
            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
          </button>
          <span class="text-xs text-text-muted px-2">
            <strong x-text="vagasPage"></strong> / <strong x-text="vagasTotalPages"></strong>
          </span>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="vagasPage === vagasTotalPages" @click="vagasPage++" title="Próxima">
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </button>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="vagasPage === vagasTotalPages" @click="vagasPage = vagasTotalPages" title="Última">
            <i data-lucide="chevrons-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
