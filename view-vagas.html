<div class="main-content" x-show="currentView === 'vagas'" x-cloak>
  <div class="space-y-5">

    <!-- Cabeçalho -->
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <p x-show="vagasUltimaConsulta" class="text-xs text-text-muted flex items-center gap-1.5">
          <i data-lucide="clock" class="w-3 h-3"></i>
          Atualizado em: <span x-text="vagasUltimaConsulta"></span>
        </p>
      </div>
      <div class="flex flex-wrap gap-2 w-full sm:w-auto">
        <button class="btn-outline flex-1 sm:flex-none justify-center" @click="vagasLoaded = false; contratosLoaded = false; estagiariosLoaded = false; loadVagas()">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Atualizar
        </button>
        <template x-if="canEdit()">
          <button class="btn-primary flex-1 sm:flex-none justify-center" @click="openAddVaga()">
            <i data-lucide="plus" class="w-4 h-4"></i>
            Nova Vaga
          </button>
        </template>
      </div>
    </div>

    <!-- Filtros -->
    <div class="card px-5 py-4">
      <div class="flex flex-col sm:flex-row gap-2.5">
        <div class="relative flex-1">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-text-muted pointer-events-none"></i>
          <input type="text"
                 x-model="vagasSearch"
                 placeholder="Buscar por código, estagiário ou lotação..."
                 class="form-input pl-9 pr-9 w-full" />
          <button type="button"
                  x-show="vagasSearch"
                  @click="vagasSearch = ''"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-text-main transition-colors">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <select x-model="vagasFiltroTipo" class="select-input sm:w-44">
          <option value="">Todos os tipos</option>
          <option value="graduacao">Graduação</option>
          <option value="pos_graduacao">Pós-Graduação</option>
          <option value="indefinido">Indefinido</option>
        </select>
        <select x-model="vagasFiltroStatus" class="select-input sm:w-40">
          <option value="">Todos os status</option>
          <option value="alocada">Alocada</option>
          <option value="nao_alocada">Não alocada</option>
        </select>
      </div>
    </div>

    <!-- Badges de filtros ativos -->
    <div x-show="vagasSearch || vagasFiltroTipo || vagasFiltroStatus"
         class="flex flex-wrap items-center gap-2">
      <button type="button"
              @click="vagasSearch = ''; vagasFiltroTipo = ''; vagasFiltroStatus = ''"
              class="btn-outline text-xs py-1 px-2.5">
        Limpar filtros
      </button>
      <template x-if="vagasSearch">
        <span class="flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-primary/10 text-primary border border-primary/20">
          <span x-text="'Busca: ' + vagasSearch"></span>
          <button type="button" @click="vagasSearch = ''">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </span>
      </template>
      <template x-if="vagasFiltroTipo">
        <span class="flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-primary/10 text-primary border border-primary/20">
          <span x-text="'Tipo: ' + ({ graduacao: 'Graduação', pos_graduacao: 'Pós-Graduação', indefinido: 'Indefinido' }[vagasFiltroTipo] || vagasFiltroTipo)"></span>
          <button type="button" @click="vagasFiltroTipo = ''">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </span>
      </template>
      <template x-if="vagasFiltroStatus">
        <span class="flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-primary/10 text-primary border border-primary/20">
          <span x-text="'Status: ' + ({ alocada: 'Alocada', nao_alocada: 'Não alocada' }[vagasFiltroStatus] || vagasFiltroStatus)"></span>
          <button type="button" @click="vagasFiltroStatus = ''">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </span>
      </template>
    </div>

    <!-- Card principal -->
    <div class="card overflow-hidden">

      <div class="overflow-x-auto">
        <table class="w-full border-collapse">

          <!-- Cabeçalho -->
          <thead>
            <tr class="bg-bg-light border-b border-border">

              <!-- Código (sortável) -->
              <th class="px-5 py-3.5 text-left w-24">
                <button class="flex items-center gap-1 group"
                        @click="vagasSortBy === 'codigo' ? vagasSortDir = (vagasSortDir === 'asc' ? 'desc' : 'asc') : (vagasSortBy = 'codigo', vagasSortDir = 'asc')"
                        :title="vagasSortBy === 'codigo' ? (vagasSortDir === 'asc' ? 'Ordenado por código A→Z. Clique para inverter.' : 'Ordenado por código Z→A. Clique para inverter.') : 'Clique para ordenar por código'">
                  <span class="text-xs font-semibold text-text-muted uppercase tracking-wide group-hover:text-primary transition-colors">Código</span>
                  <i class="w-3 h-3 text-text-muted group-hover:text-primary transition-colors"
                     :data-lucide="vagasSortBy === 'codigo' ? (vagasSortDir === 'asc' ? 'arrow-up' : 'arrow-down') : 'arrow-up-down'"></i>
                </button>
              </th>

              <!-- Tipo -->
              <th class="px-5 py-3.5 text-left w-40 hidden md:table-cell">
                <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Tipo</span>
              </th>

              <!-- Status -->
              <th class="px-5 py-3.5 text-left w-32 hidden md:table-cell">
                <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Status</span>
              </th>

              <!-- Lotação -->
              <th class="px-5 py-3.5 text-left">
                <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Lotação</span>
              </th>

              <!-- Estagiário (sortável) -->
              <th class="px-5 py-3.5 text-left min-w-40 hidden lg:table-cell">
                <button class="flex items-center gap-1 group"
                        @click="vagasSortBy === 'estagiario' ? vagasSortDir = (vagasSortDir === 'asc' ? 'desc' : 'asc') : (vagasSortBy = 'estagiario', vagasSortDir = 'asc')"
                        :title="vagasSortBy === 'estagiario' ? (vagasSortDir === 'asc' ? 'Ordenado por estagiário A→Z. Clique para inverter.' : 'Ordenado por estagiário Z→A. Clique para inverter.') : 'Clique para ordenar por estagiário'">
                  <span class="text-xs font-semibold text-text-muted uppercase tracking-wide group-hover:text-primary transition-colors">Estagiário</span>
                  <i class="w-3 h-3 text-text-muted group-hover:text-primary transition-colors"
                     :data-lucide="vagasSortBy === 'estagiario' ? (vagasSortDir === 'asc' ? 'arrow-up' : 'arrow-down') : 'arrow-up-down'"></i>
                </button>
              </th>

              <!-- Ações -->
              <th class="px-5 py-3.5 text-right w-28">
                <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Ações</span>
              </th>

            </tr>
          </thead>

          <!-- Body -->
          <tbody class="divide-y divide-border">

            <!-- Estado vazio -->
            <template x-if="vagasFiltradas.length === 0">
              <tr>
                <td colspan="6" class="py-16 text-center">
                  <div class="w-12 h-12 rounded-2xl bg-bg-medium flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="briefcase" class="w-6 h-6 text-text-muted"></i>
                  </div>
                  <p class="text-text-muted text-sm">Nenhuma vaga encontrada.</p>
                </td>
              </tr>
            </template>

            <!-- Linhas -->
            <template x-for="v in vagasPaged" :key="v.id">
              <tr class="hover:bg-bg-light transition-colors">

                <!-- Código -->
                <td class="px-5 py-3.5 w-24">
                  <p class="text-sm font-semibold text-text-main font-mono" x-text="vagaCodigo(v)"></p>
                </td>

                <!-- Tipo -->
                <td class="px-5 py-3.5 w-40 hidden md:table-cell">
                  <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium"
                        :class="{
                          'bg-blue-50 text-blue-700': v.tipo_vaga === 'graduacao',
                          'bg-purple-50 text-purple-700': v.tipo_vaga === 'pos_graduacao',
                          'bg-gray-100 text-gray-600': v.tipo_vaga === 'indefinido'
                        }"
                        x-text="vagaTipoLabel(v.tipo_vaga)">
                  </span>
                </td>

                <!-- Status -->
                <td class="px-5 py-3.5 w-32 hidden md:table-cell">
                  <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium"
                        :class="{
                          'bg-green-50 text-green-700': v.status === 'alocada',
                          'bg-yellow-50 text-yellow-700': v.status === 'nao_alocada'
                        }"
                        x-text="v.status === 'alocada' ? 'Alocada' : 'Não alocada'">
                  </span>
                </td>

                <!-- Lotação -->
                <td class="px-5 py-3.5">
                  <template x-if="!vagaLotacao(v)">
                    <p class="text-sm text-text-muted">—</p>
                  </template>
                  <template x-if="vagaLotacao(v)">
                    <div>
                      <p class="text-sm font-medium text-text-main truncate" x-text="vagaLotacao(v).linha1"></p>
                      <p class="text-xs text-text-muted truncate" x-show="vagaLotacao(v).linha2" x-text="vagaLotacao(v).linha2"></p>
                      <!-- Mobile: mostrar código da vaga abaixo da lotação -->
                      <p class="text-xs text-text-muted font-mono mt-0.5 md:hidden" x-text="vagaCodigo(v)"></p>
                    </div>
                  </template>
                </td>

                <!-- Estagiário -->
                <td class="px-5 py-3.5 min-w-40 hidden lg:table-cell">
                  <p class="text-sm text-text-muted truncate" x-text="vagaEstagiario(v) || '—'"></p>
                </td>

                <!-- Ações -->
                <td class="px-5 py-3.5 w-28">
                  <div class="flex items-center gap-1 justify-end">
                    <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center
                                   text-text-muted hover:border-primary hover:text-primary transition-all"
                            @click="openViewVaga(v)" title="Visualizar vaga">
                      <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                    <template x-if="canEdit()">
                      <span class="flex items-center gap-1">
                        <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center
                                       text-text-muted hover:border-primary hover:text-primary transition-all"
                                @click="openEditVaga(v)" title="Editar vaga">
                          <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center transition-all"
                                :class="vagaTemContrato(v)
                                  ? 'opacity-30 cursor-not-allowed text-text-muted'
                                  : 'text-text-muted hover:border-red-300 hover:text-red-500'"
                                :disabled="vagaTemContrato(v)"
                                :title="vagaTemContrato(v) ? 'Vaga possui contratos vinculados' : 'Excluir vaga'"
                                @click="!vagaTemContrato(v) && deleteVaga(v)">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      </span>
                    </template>
                  </div>
                </td>

              </tr>
            </template>

          </tbody>
        </table>
      </div>

      <!-- Rodapé com paginação -->
      <div class="px-5 py-3 border-t border-border flex flex-col sm:flex-row items-center justify-between gap-3"
           x-show="vagasFiltradas.length > 0">
        <div class="flex items-center gap-2 text-xs text-text-muted">
          <strong x-text="vagasFiltradas.length"></strong>
          <span x-text="vagasFiltradas.length === 1 ? 'registro' : 'registros'"></span>
          <span class="text-border">·</span>
          <span>Exibindo</span>
          <select x-model.number="vagasPerPage"
                  @change="vagasPage = 1"
                  class="select-input text-xs py-1 px-2 w-16">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
          <span>por página</span>
        </div>
        <div class="flex items-center gap-1">
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="vagasPage === 1" @click="vagasPage = 1" title="Primeira página">
            <i data-lucide="chevrons-left" class="w-3.5 h-3.5"></i>
          </button>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="vagasPage === 1" @click="vagasPage--" title="Anterior">
            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
          </button>
          <span class="text-xs text-text-muted px-2">
            <strong x-text="vagasPage"></strong> / <strong x-text="vagasTotalPages"></strong>
          </span>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="vagasPage === vagasTotalPages" @click="vagasPage++" title="Próxima">
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </button>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="vagasPage === vagasTotalPages" @click="vagasPage = vagasTotalPages" title="Última">
            <i data-lucide="chevrons-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
