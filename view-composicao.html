<template x-if="currentView === 'composicao' && canAdmin()">
<div class="main-content" x-cloak>
  <div class="space-y-5">

    <!-- Cabeçalho -->
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <p x-show="composicaoUltimaConsulta" class="text-xs text-text-muted flex items-center gap-1.5">
          <i data-lucide="clock" class="w-3 h-3"></i>
          Atualizado em: <span x-text="composicaoUltimaConsulta"></span>
        </p>
      </div>
      <div class="flex flex-wrap gap-2 w-full sm:w-auto">
        <button class="btn-outline flex-1 sm:flex-none justify-center" @click="loadComposicao()">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Atualizar
        </button>
        <template x-if="canEdit()">
          <button class="btn-outline flex-1 sm:flex-none justify-center"
                  @click="exportarPdfComposicao()"
                  :disabled="exportandoPdf || !grupos.length"
                  :title="!grupos.length ? 'Nenhum dado para exportar' : ''">
            <i data-lucide="loader-2" class="w-4 h-4 animate-spin" x-show="exportandoPdf"></i>
            <i data-lucide="download" class="w-4 h-4" x-show="!exportandoPdf"></i>
            <span x-text="exportandoPdf ? 'Gerando...' : 'Exportar PDF'"></span>
          </button>
        </template>
        <template x-if="canAdmin()">
          <button class="btn-primary flex-1 sm:flex-none justify-center" @click="openAddGrupo()">
            <i data-lucide="plus" class="w-4 h-4"></i>
            Novo Grupo
          </button>
        </template>
      </div>
    </div>

    <!-- Container dos 3 painéis -->
    <div class="card overflow-hidden flex h-[80vh]">

      <!-- Painel 1 — Grupos -->
      <div class="flex flex-col border-r border-border w-full lg:w-[260px] xl:w-[330px]"
           :class="{ 'hidden lg:flex': composicaoPanelLevel !== 1, 'flex': composicaoPanelLevel === 1 }">

        <!-- Header -->
        <div class="px-4 py-3 border-b border-border flex items-center justify-between flex-shrink-0">
          <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Grupos Jurisdicionais</span>
          <span class="badge badge-primary text-xs" x-text="grupos.length"></span>
        </div>

        <!-- Busca -->
        <div class="px-3 py-2 border-b border-border flex-shrink-0">
          <div class="relative">
            <i data-lucide="search" class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-text-muted pointer-events-none"></i>
            <input type="text"
                   x-model="composicaoSearch"
                   placeholder="Buscar grupo..."
                   class="form-input pl-8 py-1.5 text-sm w-full" />
          </div>
        </div>

        <!-- Lista -->
        <div class="flex-1 overflow-y-auto">
          <template x-if="gruposFiltrados.length === 0">
            <div class="py-10 text-center">
              <p class="text-text-muted text-xs">Nenhum grupo encontrado.</p>
            </div>
          </template>
          <template x-for="grupo in gruposFiltrados" :key="grupo.id">
            <div class="px-4 py-3 cursor-pointer border-b border-border transition-colors flex items-center justify-between gap-2"
                 :class="selectedGrupo?.id === grupo.id ? 'bg-primary/10 border-l-2 border-l-primary' : 'hover:bg-bg-light'"
                 @click="selectGrupo(grupo)">
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-text-main truncate" x-text="grupo.nome"></p>
                <p x-show="grupo.descricao" class="text-xs text-text-muted truncate" x-text="grupo.descricao"></p>
              </div>
              <template x-if="canAdmin()">
                <div class="flex items-center gap-0.5 flex-shrink-0" @click.stop>
                  <button class="w-6 h-6 rounded flex items-center justify-center text-text-muted hover:text-primary transition-colors"
                          @click="openEditGrupo(grupo)" title="Editar grupo">
                    <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                  </button>
                  <button class="w-6 h-6 rounded flex items-center justify-center text-text-muted hover:text-red-500 transition-colors"
                          @click="deleteGrupo(grupo)" title="Excluir grupo">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- Footer -->
        <template x-if="canAdmin()">
          <div class="px-3 py-2 border-t border-border flex-shrink-0">
            <button class="w-full btn-outline py-1.5 text-sm justify-center" @click="openAddGrupo()">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              Grupo
            </button>
          </div>
        </template>

      </div>

      <!-- Painel 2 — Órgãos -->
      <div class="flex flex-col border-r border-border w-full lg:w-[260px] xl:w-[330px]"
           :class="{ 'hidden lg:flex': composicaoPanelLevel !== 2, 'flex': composicaoPanelLevel === 2 }">

        <!-- Header -->
        <div class="px-4 py-3 border-b border-border flex items-center justify-between flex-shrink-0">
          <div class="flex items-center gap-2">
            <button class="lg:hidden text-text-muted hover:text-primary transition-colors"
                    @click="composicaoPanelLevel = 1" title="Voltar">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Órgãos Julgadores</span>
          </div>
          <span class="badge badge-primary text-xs" x-text="orgaosDoGrupo.length"></span>
        </div>

        <!-- Subtítulo -->
        <div class="px-4 py-2 border-b border-border flex-shrink-0" x-show="selectedGrupo">
          <p class="text-xs text-text-muted truncate" x-text="selectedGrupo?.nome"></p>
        </div>

        <!-- Lista -->
        <div class="flex-1 overflow-y-auto">
          <template x-if="!selectedGrupo">
            <div class="py-10 text-center">
              <p class="text-text-muted text-xs">Selecione um grupo.</p>
            </div>
          </template>
          <template x-if="selectedGrupo && orgaosDoGrupo.length === 0">
            <div class="py-10 text-center">
              <p class="text-text-muted text-xs">Nenhum órgão neste grupo.</p>
            </div>
          </template>
          <template x-for="orgao in orgaosDoGrupo" :key="orgao.id">
            <div class="px-4 py-3 cursor-pointer border-b border-border transition-colors flex items-center justify-between gap-2"
                 :class="selectedOrgao?.id === orgao.id ? 'bg-primary/10 border-l-2 border-l-primary' : 'hover:bg-bg-light'"
                 @click="selectOrgao(orgao)">
              <p class="text-sm font-medium text-text-main truncate flex-1" x-text="orgao.nome"></p>
              <template x-if="canAdmin()">
                <div class="flex items-center gap-0.5 flex-shrink-0" @click.stop>
                  <button class="w-6 h-6 rounded flex items-center justify-center text-text-muted hover:text-primary transition-colors"
                          @click="openEditOrgao(orgao)" title="Editar órgão">
                    <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                  </button>
                  <button class="w-6 h-6 rounded flex items-center justify-center text-text-muted hover:text-red-500 transition-colors"
                          @click="deleteOrgao(orgao)" title="Excluir órgão">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- Footer -->
        <template x-if="canAdmin() && selectedGrupo">
          <div class="px-3 py-2 border-t border-border flex-shrink-0">
            <button class="w-full btn-outline py-1.5 text-sm justify-center" @click="openAddOrgao()">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              Órgão
            </button>
          </div>
        </template>

      </div>

      <!-- Painel 3 — Cargos -->
      <div class="flex flex-col flex-1 min-w-0"
           :class="{ 'hidden lg:flex': composicaoPanelLevel !== 3, 'flex': composicaoPanelLevel === 3 }">

        <!-- Header -->
        <div class="px-4 py-3 border-b border-border flex items-center justify-between flex-shrink-0">
          <div class="flex items-center gap-2">
            <button class="lg:hidden text-text-muted hover:text-primary transition-colors"
                    @click="composicaoPanelLevel = 2" title="Voltar">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Composição</span>
          </div>
          <span x-show="selectedOrgao" class="badge badge-primary text-xs" x-text="cargosDoOrgao.length"></span>
        </div>

        <!-- Subtítulo -->
        <div class="px-4 py-2 border-b border-border flex-shrink-0" x-show="selectedOrgao">
          <p class="text-xs text-text-muted truncate" x-text="selectedOrgao?.nome"></p>
        </div>

        <!-- Lista -->
        <div class="flex-1 overflow-y-auto">

          <!-- Estado: nenhum órgão selecionado -->
          <template x-if="!selectedOrgao">
            <div class="h-full p-2 text-center flex flex-col items-center justify-center gap-3">
              <div class="w-12 h-12 rounded-2xl bg-bg-medium flex items-center justify-center">
                <i data-lucide="layout-list" class="w-6 h-6 text-text-muted"></i>
              </div>
              <p class="text-text-muted text-sm">Selecione um órgão para ver os cargos.</p>
            </div>
          </template>

          <!-- Estado: órgão selecionado sem cargos -->
          <template x-if="selectedOrgao && cargosDoOrgao.length === 0">
            <div class="py-10 text-center">
              <p class="text-text-muted text-sm">Nenhum cargo neste órgão.</p>
            </div>
          </template>

          <!-- Lista de cargos -->
          <template x-for="cargo in cargosDoOrgao" :key="cargo.id">
            <div class="px-4 py-3 border-b border-border hover:bg-bg-light transition-colors">
              <div class="flex flex-wrap items-start gap-x-2 gap-y-1">

                <!-- Info: cargo + magistrado (cresce, empurra botões para direita ou quebra) -->
                <div class="flex flex-col gap-0.5 flex-1 min-w-[170px]">
                  <div class="flex items-center gap-1.5 min-w-0">
                    <span class="text-sm font-medium text-text-main truncate" x-text="cargo.nome"></span>
                    <span x-show="cargo.is_presidente === 'TRUE'" class="badge badge-success text-xs flex-shrink-0">Presidente</span>
                  </div>
                  <p class="text-xs text-text-muted truncate">
                    <span x-show="getOcupacaoAtiva(cargo.id)" x-text="getMagistradoNome(getOcupacaoAtiva(cargo.id)?.id_magistrado)"></span>
                    <span x-show="!getOcupacaoAtiva(cargo.id)" class="italic">Vago</span>
                  </p>
                </div>

                <!-- Botões: ficam ao lado quando há espaço, quebram para próxima linha se apertar -->
                <template x-if="canAdmin()">
                  <div class="flex flex-wrap gap-1 flex-shrink-0">
                    <button class="w-7 h-7 rounded border border-border flex items-center justify-center text-text-muted hover:border-primary hover:text-primary transition-all"
                            @click="openEditCargo(cargo)" title="Editar cargo">
                      <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                    </button>
                    <button class="w-7 h-7 rounded border border-border flex items-center justify-center text-text-muted hover:border-red-300 hover:text-red-500 transition-all"
                            @click="deleteCargo(cargo)" title="Excluir cargo">
                      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                    <button x-show="cargo.is_presidente !== 'TRUE'"
                            class="w-7 h-7 rounded border border-border flex items-center justify-center text-text-muted hover:border-warning hover:text-warning transition-all"
                            @click="setCargoPresidente(cargo)" title="Marcar como presidente">
                      <i data-lucide="award" class="w-3.5 h-3.5"></i>
                    </button>
                    <button class="w-7 h-7 rounded border border-border flex items-center justify-center text-text-muted hover:border-success hover:text-success transition-all"
                            @click="openVincularMagistrado(cargo)" title="Vincular magistrado">
                      <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
                    </button>
                    <button x-show="getOcupacaoAtiva(cargo.id)"
                            class="w-7 h-7 rounded border border-border flex items-center justify-center text-text-muted hover:border-danger hover:text-danger transition-all"
                            @click="removerMagistrado(cargo)" title="Remover magistrado">
                      <i data-lucide="user-minus" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </template>

              </div>
            </div>
          </template>

        </div>

        <!-- Footer -->
        <template x-if="canAdmin() && selectedOrgao">
          <div class="px-3 py-2 border-t border-border flex-shrink-0">
            <button class="w-full btn-outline py-1.5 text-sm justify-center" @click="openAddCargo()">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              Cargo
            </button>
          </div>
        </template>

      </div>

    </div>
  </div>
</div>
</template>
