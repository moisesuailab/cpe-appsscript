<div class="main-content" x-show="currentView === 'dashboard'" x-cloak>
  <div class="space-y-5">

    <!-- Cabeçalho -->
    <div class="flex flex-col flex-wrap items-end justify-between gap-3">
      <div>
        <p x-show="dashboardUltimaConsulta" class="text-xs text-text-muted flex items-center gap-1.5">
          <i data-lucide="clock" class="w-3 h-3"></i>
          Atualizado em: <span x-text="dashboardUltimaConsulta"></span>
        </p>
      </div>
      <div class="flex flex-wrap gap-2 w-full sm:w-auto">
        <button class="btn-outline flex-1 sm:flex-none justify-center" @click="dashboardLoaded = false; loadDashboard()">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Atualizar
        </button>
      </div>
    </div>

    <!-- Seção 1 — KPI cards de vagas -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">

      <div class="card p-5 flex flex-col items-center jsutify-between">
        <p class="text-xs font-heading uppercase text-text-muted">Total de Vagas</p>
        <p class="text-3xl font-bold mt-1 text-text-main" x-text="dashboard?.totalVagas ?? '—'"></p>
      </div>

      <div class="card p-5 flex flex-col items-center jsutify-between">
        <p class="text-xs font-heading uppercase text-text-muted">Ocupadas</p>
        <p class="text-3xl font-bold mt-1 text-success" x-text="dashboard?.vagasOcupadas ?? '—'"></p>
      </div>

      <div class="card p-5 flex flex-col items-center jsutify-between">
        <p class="text-xs font-heading uppercase text-text-muted">Ociosas</p>
        <p class="text-3xl font-bold mt-1 text-warning" x-text="dashboard?.vagasOciosas ?? '—'"></p>
      </div>

      <div class="card p-5 flex flex-col items-center jsutify-between">
        <p class="text-xs font-heading uppercase text-text-muted">Alocadas a Órgão</p>
        <p class="text-3xl font-bold mt-1 text-text-main" x-text="dashboard?.vagasAlocadasOrgao ?? '—'"></p>
      </div>

      <div class="card p-5 flex flex-col items-center jsutify-between">
        <p class="text-xs font-heading uppercase text-text-muted">Alocadas no Setor</p>
        <p class="text-3xl font-bold mt-1 text-text-main" x-text="dashboard?.vagasAlocadasSetor ?? '—'"></p>
      </div>

    </div>

    <!-- Seção 2 — Alertas de contratos -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

      <div class="card p-5 border-l-4 border-danger">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <i data-lucide="alert-circle" class="w-5 h-5 text-danger"></i>
            <div>
              <p class="text-xs font-heading uppercase text-text-muted">Vencendo em 30 dias</p>
              <p class="text-sm text-text-main mt-0.5">Contratos próximos do vencimento</p>
            </div>
          </div>
          <span
            class="badge"
            :class="(dashboard?.contratosVencendo30d ?? 0) > 0 ? 'badge-danger' : 'badge-success'"
            x-text="(dashboard?.contratosVencendo30d ?? 0) > 0 ? dashboard.contratosVencendo30d : 'Nenhum'">
          </span>
        </div>
      </div>

      <div class="card p-5 border-l-4 border-warning">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <i data-lucide="clock" class="w-5 h-5 text-warning"></i>
            <div>
              <p class="text-xs font-heading uppercase text-text-muted">Vencendo em 60 dias</p>
              <p class="text-sm text-text-main mt-0.5">Contratos em alerta moderado</p>
            </div>
          </div>
          <span
            class="badge"
            :class="(dashboard?.contratosVencendo60d ?? 0) > 0 ? 'badge-warning' : 'badge-success'"
            x-text="(dashboard?.contratosVencendo60d ?? 0) > 0 ? dashboard.contratosVencendo60d : 'Nenhum'">
          </span>
        </div>
      </div>

    </div>

    <!-- Seção 3 — Distribuição por tipo de vaga -->
    <div class="card p-5">
      <p class="font-heading uppercase text-sm mb-4 text-text-main">Distribuição por Tipo de Vaga</p>

      <div class="space-y-4">

        <div>
          <div class="flex items-center justify-between mb-1">
            <span class="text-sm text-text-main">Graduação</span>
            <span class="text-sm text-text-muted" x-text="dashboard ? (dashboard.vagasGraduacao + ' (' + dashboardPct(dashboard.vagasGraduacao) + '%)') : '—'"></span>
          </div>
          <div class="h-2.5 rounded-full bg-bg-medium">
            <div class="h-2.5 rounded-full bg-primary transition-all" :style="'width: ' + (dashboard ? dashboardPct(dashboard.vagasGraduacao) : 0) + '%'"></div>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <span class="text-sm text-text-main">Pós-graduação</span>
            <span class="text-sm text-text-muted" x-text="dashboard ? (dashboard.vagasPosGraduacao + ' (' + dashboardPct(dashboard.vagasPosGraduacao) + '%)') : '—'"></span>
          </div>
          <div class="h-2.5 rounded-full bg-bg-medium">
            <div class="h-2.5 rounded-full bg-info transition-all" :style="'width: ' + (dashboard ? dashboardPct(dashboard.vagasPosGraduacao) : 0) + '%'"></div>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <span class="text-sm text-text-main">Indefinidas</span>
            <span class="text-sm text-text-muted" x-text="dashboard ? (dashboard.vagasIndefinidas + ' (' + dashboardPct(dashboard.vagasIndefinidas) + '%)') : '—'"></span>
          </div>
          <div class="h-2.5 rounded-full bg-bg-medium">
            <div class="h-2.5 rounded-full bg-bg-dark transition-all" :style="'width: ' + (dashboard ? dashboardPct(dashboard.vagasIndefinidas) : 0) + '%'"></div>
          </div>
        </div>

      </div>

      <p x-show="dashboard?.ultimoRecalculo" class="text-xs text-text-muted mt-5">
        Último recálculo da planilha: <span x-text="dashboard?.ultimoRecalculo"></span>
      </p>
    </div>

  </div>
</div>
