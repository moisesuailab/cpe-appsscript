<div class="main-content" x-show="currentView === 'dashboard'" x-cloak>
  <div class="flex flex-col gap-4 overflow-x-hidden">

    <!-- Cabeçalho -->
    <div class="flex items-center justify-between gap-4">
      <p x-show="dashboardUltimaConsulta" class="flex items-center gap-1.5 text-[0.68rem] text-[#A0AEC0]">
        <i data-lucide="clock" class="w-3 h-3"></i>
        Atualizado em <span x-text="dashboardUltimaConsulta"></span>
      </p>
      <button class="btn-outline flex-shrink-0" @click="dashboardLoaded = false; loadDashboard()">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        <span class="db-refresh-label">Atualizar</span>
      </button>
    </div>

    <!-- Seção 1 — KPI cards de vagas -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">

      <div class="bg-white rounded-xl border border-[#E2E8F0] shadow-sm p-4 flex items-stretch gap-3 transition-all duration-200 hover:-translate-y-px hover:shadow-md">
        <div class="db-kpi-icon-neutral w-[34px] h-[34px] rounded-[9px] flex items-center justify-center flex-shrink-0 self-start">
          <i data-lucide="briefcase" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0 flex flex-col">
          <p class="font-heading text-[0.65rem] font-semibold uppercase tracking-wide text-text-muted leading-snug flex-1">Total de Vagas</p>
          <p class="font-heading text-[1.875rem] font-bold text-text-main leading-none" x-text="dashboard?.totalVagas ?? '—'"></p>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-[#E2E8F0] shadow-sm p-4 flex items-stretch gap-3 transition-all duration-200 hover:-translate-y-px hover:shadow-md">
        <div class="db-kpi-icon-success w-[34px] h-[34px] rounded-[9px] flex items-center justify-center flex-shrink-0 self-start">
          <i data-lucide="user-check" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0 flex flex-col">
          <p class="font-heading text-[0.65rem] font-semibold uppercase tracking-wide text-text-muted leading-snug flex-1">Ocupadas</p>
          <p class="font-heading text-[1.875rem] font-bold text-success leading-none" x-text="dashboard?.vagasOcupadas ?? '—'"></p>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-[#E2E8F0] shadow-sm p-4 flex items-stretch gap-3 transition-all duration-200 hover:-translate-y-px hover:shadow-md">
        <div class="db-kpi-icon-warning w-[34px] h-[34px] rounded-[9px] flex items-center justify-center flex-shrink-0 self-start">
          <i data-lucide="user-x" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0 flex flex-col">
          <p class="font-heading text-[0.65rem] font-semibold uppercase tracking-wide text-text-muted leading-snug flex-1">Ociosas</p>
          <p class="font-heading text-[1.875rem] font-bold text-[#c05621] leading-none" x-text="dashboard?.vagasOciosas ?? '—'"></p>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-[#E2E8F0] shadow-sm p-4 flex items-stretch gap-3 transition-all duration-200 hover:-translate-y-px hover:shadow-md">
        <div class="db-kpi-icon-info w-[34px] h-[34px] rounded-[9px] flex items-center justify-center flex-shrink-0 self-start">
          <i data-lucide="scale" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0 flex flex-col">
          <p class="font-heading text-[0.65rem] font-semibold uppercase tracking-wide text-text-muted leading-snug flex-1">Alocadas a Órgão</p>
          <p class="font-heading text-[1.875rem] font-bold text-text-main leading-none" x-text="dashboard?.vagasAlocadasOrgao ?? '—'"></p>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-[#E2E8F0] shadow-sm p-4 flex items-stretch gap-3 transition-all duration-200 hover:-translate-y-px hover:shadow-md">
        <div class="db-kpi-icon-primary w-[34px] h-[34px] rounded-[9px] flex items-center justify-center flex-shrink-0 self-start">
          <i data-lucide="building-2" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0 flex flex-col">
          <p class="font-heading text-[0.65rem] font-semibold uppercase tracking-wide text-text-muted leading-snug flex-1">Alocadas no Setor</p>
          <p class="font-heading text-[1.875rem] font-bold text-text-main leading-none" x-text="dashboard?.vagasAlocadasSetor ?? '—'"></p>
        </div>
      </div>

    </div>

    <!-- Seção 2+3 — Alertas e Distribuição -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 items-stretch">

      <!-- Alertas de contratos -->
      <div class="card p-5 flex flex-col">
        <p class="font-heading text-[0.68rem] font-semibold uppercase tracking-widest text-text-muted mb-3">Alertas de Contratos</p>

        <!-- Estado vazio -->
        <div
          x-show="dashboard && (dashboard.contratosVencendo30d ?? 0) === 0 && (dashboard.contratosVencendo60d ?? 0) === 0"
          class="flex-1 flex flex-col items-center justify-center gap-2 text-text-muted">
          <i data-lucide="circle-check-big" class="w-7 h-7"></i>
          <p class="text-sm">Nenhum contrato com vencimento próximo.</p>
        </div>

        <!-- Alertas ativos -->
        <div
          x-show="!dashboard || (dashboard.contratosVencendo30d ?? 0) > 0 || (dashboard.contratosVencendo60d ?? 0) > 0"
          class="flex flex-col gap-2.5">

          <div
            x-show="(dashboard?.contratosVencendo30d ?? 0) > 0"
            class="flex items-center gap-3 px-3.5 py-3 rounded-[10px] border-l-[3px] border-l-[#FFB4B4] bg-[#FFF9F9] transition-colors duration-150 hover:bg-[#FFF2F2]">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 bg-[#FFE8E8] text-danger">
              <i data-lucide="alert-triangle" class="w-4 h-4"></i>
            </div>
            <p class="font-heading text-[0.8rem] font-semibold text-text-main flex-1 min-w-0">Vencendo em 30 dias</p>
            <span class="badge badge-danger flex-shrink-0" x-text="dashboard?.contratosVencendo30d"></span>
          </div>

          <div
            x-show="(dashboard?.contratosVencendo60d ?? 0) > 0"
            class="flex items-center gap-3 px-3.5 py-3 rounded-[10px] border-l-[3px] border-l-[#FFE5B4] bg-[#FFFCF5] transition-colors duration-150 hover:bg-[#FFF8E8]">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 bg-[#FFF0D0] text-[#c05621]">
              <i data-lucide="clock" class="w-4 h-4"></i>
            </div>
            <p class="font-heading text-[0.8rem] font-semibold text-text-main flex-1 min-w-0">Vencendo em 60 dias</p>
            <span class="badge badge-warning flex-shrink-0" x-text="dashboard?.contratosVencendo60d"></span>
          </div>

        </div>
      </div>

      <!-- Distribuição por tipo -->
      <div class="card p-5">
        <p class="font-heading text-[0.68rem] font-semibold uppercase tracking-widest text-text-muted mb-3">Distribuição por Tipo de Vaga</p>
        <div class="flex flex-col gap-4">

          <div>
            <div class="flex items-center gap-2 mb-1.5">
              <span class="w-2 h-2 rounded-full flex-shrink-0 bg-primary"></span>
              <span class="text-[0.8rem] text-text-main flex-1">Graduação</span>
              <span class="font-heading text-[0.8rem] font-semibold text-text-main" x-text="dashboard ? dashboard.vagasGraduacao : '—'"></span>
              <span class="text-[0.72rem] text-[#A0AEC0] min-w-[2.5rem] text-right" x-text="dashboard ? dashboardPct(dashboard.vagasGraduacao) + '%' : ''"></span>
            </div>
            <div class="h-1.5 bg-[#EDF2F7] rounded-full overflow-hidden">
              <div class="db-dist-bar bg-primary" :style="'width: ' + (dashboard ? dashboardPct(dashboard.vagasGraduacao) : 0) + '%'"></div>
            </div>
          </div>

          <div>
            <div class="flex items-center gap-2 mb-1.5">
              <span class="w-2 h-2 rounded-full flex-shrink-0 bg-[#C3A8DC]"></span>
              <span class="text-[0.8rem] text-text-main flex-1">Pós-graduação</span>
              <span class="font-heading text-[0.8rem] font-semibold text-text-main" x-text="dashboard ? dashboard.vagasPosGraduacao : '—'"></span>
              <span class="text-[0.72rem] text-[#A0AEC0] min-w-[2.5rem] text-right" x-text="dashboard ? dashboardPct(dashboard.vagasPosGraduacao) + '%' : ''"></span>
            </div>
            <div class="h-1.5 bg-[#EDF2F7] rounded-full overflow-hidden">
              <div class="db-dist-bar bg-[#C3A8DC]" :style="'width: ' + (dashboard ? dashboardPct(dashboard.vagasPosGraduacao) : 0) + '%'"></div>
            </div>
          </div>

          <div>
            <div class="flex items-center gap-2 mb-1.5">
              <span class="w-2 h-2 rounded-full flex-shrink-0 bg-[#CBD5E0]"></span>
              <span class="text-[0.8rem] text-text-main flex-1">Indefinidas</span>
              <span class="font-heading text-[0.8rem] font-semibold text-text-main" x-text="dashboard ? dashboard.vagasIndefinidas : '—'"></span>
              <span class="text-[0.72rem] text-[#A0AEC0] min-w-[2.5rem] text-right" x-text="dashboard ? dashboardPct(dashboard.vagasIndefinidas) + '%' : ''"></span>
            </div>
            <div class="h-1.5 bg-[#EDF2F7] rounded-full overflow-hidden">
              <div class="db-dist-bar bg-[#CBD5E0]" :style="'width: ' + (dashboard ? dashboardPct(dashboard.vagasIndefinidas) : 0) + '%'"></div>
            </div>
          </div>

        </div>

      </div>

    </div>

  </div>
</div>
