<div class="main-content" x-show="currentView === 'estagiarios'" x-cloak>
  <div class="space-y-5">

    <!-- Cabeçalho -->
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <p x-show="estagiariosUltimaConsulta" class="text-xs text-text-muted flex items-center gap-1.5">
          <i data-lucide="clock" class="w-3 h-3"></i>
          Atualizado em: <span x-text="estagiariosUltimaConsulta"></span>
        </p>
      </div>
      <div class="flex flex-wrap gap-2 w-full sm:w-auto">
        <button class="btn-outline flex-1 sm:flex-none justify-center" @click="loadEstagiarios()">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Atualizar
        </button>
        <template x-if="canEdit()">
          <button class="btn-primary flex-1 sm:flex-none justify-center" @click="openAddEstagiario()">
            <i data-lucide="plus" class="w-4 h-4"></i>
            Novo Estagiário
          </button>
        </template>
      </div>
    </div>

    <!-- Filtro -->
    <div class="card px-5 py-4">
      <div class="relative">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-text-muted pointer-events-none"></i>
        <input type="text"
               x-model="estagiariosSearch"
               placeholder="Buscar por nome ou CPF..."
               class="form-input pl-9 w-full" />
      </div>
    </div>

    <!-- Card principal -->
    <div class="card overflow-hidden">

      <!-- Cabeçalhos de coluna -->
      <div class="px-5 py-4 bg-bg-light hidden sm:flex items-center gap-3">
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide flex-1">Nome</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-36">CPF</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-48 hidden md:block">E-mail</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-28 text-right pr-1">Ações</p>
      </div>

      <!-- Tabela -->
      <div class="divide-y divide-border">
        <template x-if="estagiosFiltrados.length === 0">
          <div class="py-16 text-center">
            <div class="w-12 h-12 rounded-2xl bg-bg-medium flex items-center justify-center mx-auto mb-3">
              <i data-lucide="graduation-cap" class="w-6 h-6 text-text-muted"></i>
            </div>
            <p class="text-text-muted text-sm">Nenhum estagiário encontrado.</p>
          </div>
        </template>
        <template x-for="e in estagiosPaged" :key="e.id">
          <div class="px-5 py-3.5 flex items-center gap-3 hover:bg-bg-light transition-colors">
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-text-main truncate" x-text="e.nome"></p>
              <p class="text-xs text-text-muted sm:hidden" x-text="e.cpf"></p>
            </div>
            <p class="text-sm text-text-muted w-36 truncate hidden sm:block" x-text="e.cpf"></p>
            <p class="text-sm text-text-muted w-48 truncate hidden md:block" x-text="e.email || '—'"></p>
            <div class="flex items-center gap-1 flex-shrink-0 w-28 justify-end">
              <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center
                             text-text-muted hover:border-primary hover:text-primary transition-all"
                      @click="openViewEstagiario(e)" title="Visualizar estagiário">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
              <template x-if="canEdit()">
                <span class="flex items-center gap-1">
                  <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center
                                 text-text-muted hover:border-primary hover:text-primary transition-all"
                          @click="openEditEstagiario(e)" title="Editar estagiário">
                    <i data-lucide="pencil" class="w-4 h-4"></i>
                  </button>
                  <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center transition-all"
                          :class="contratos.some(c => c.id_estagiario === e.id)
                            ? 'opacity-30 cursor-not-allowed text-text-muted'
                            : 'text-text-muted hover:border-red-300 hover:text-red-500'"
                          :disabled="contratos.some(c => c.id_estagiario === e.id)"
                          :title="contratos.some(c => c.id_estagiario === e.id) ? 'Estagiário possui contratos vinculados' : 'Excluir estagiário'"
                          @click="!contratos.some(c => c.id_estagiario === e.id) && deleteEstagiario(e)">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </span>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- Rodapé com paginação -->
      <div class="px-5 py-3 border-t border-border flex flex-col sm:flex-row items-center justify-between gap-3"
           x-show="estagiosFiltrados.length > 0">
        <div class="flex items-center gap-2 text-xs text-text-muted">
          <strong x-text="estagiosFiltrados.length"></strong>
          <span x-text="estagiosFiltrados.length === 1 ? 'registro' : 'registros'"></span>
          <span class="text-border">·</span>
          <span>Exibindo</span>
          <select x-model.number="estagiariosPerPage"
                  @change="estagiariosPage = 1"
                  class="select-input text-xs py-1 px-2 w-16">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
          <span>por página</span>
        </div>
        <div class="flex items-center gap-1">
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="estagiariosPage === 1" @click="estagiariosPage = 1" title="Primeira página">
            <i data-lucide="chevrons-left" class="w-3.5 h-3.5"></i>
          </button>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="estagiariosPage === 1" @click="estagiariosPage--" title="Anterior">
            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
          </button>
          <span class="text-xs text-text-muted px-2">
            <strong x-text="estagiariosPage"></strong> / <strong x-text="estagiosTotalPages"></strong>
          </span>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="estagiariosPage === estagiosTotalPages" @click="estagiariosPage++" title="Próxima">
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </button>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="estagiariosPage === estagiosTotalPages" @click="estagiariosPage = estagiosTotalPages" title="Última">
            <i data-lucide="chevrons-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
