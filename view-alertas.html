<div class="main-content" x-show="currentView === 'alertas'" x-cloak>
  <div class="space-y-5">

    <!-- Cabeçalho -->
    <div class="flex flex-wrap items-center justify-between gap-3">
      <p x-show="alertasUltimaConsulta" class="text-xs text-text-muted flex items-center gap-1.5">
        <i data-lucide="clock" class="w-3 h-3"></i>
        Atualizado em: <span x-text="alertasUltimaConsulta"></span>
      </p>
      <button class="btn-outline"
              @click="alertasLoaded = false; contratosLoaded = false; loadAlertas()">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        Atualizar
      </button>
    </div>

    <!-- Cards de resumo (informativos) -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">

      <div class="card p-4 flex items-center gap-3 border-l-[3px] border-l-danger">
        <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0 bg-[#FFE8E8] text-danger">
          <i data-lucide="alert-triangle" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-heading text-[0.62rem] font-semibold uppercase tracking-wide text-text-muted leading-snug">Crítico</p>
          <p class="font-heading text-[1.5rem] font-bold text-danger leading-none" x-text="alertasVencendo30.length"></p>
          <p class="text-[0.68rem] text-text-muted mt-0.5">Vencendo em até 30 dias</p>
        </div>
      </div>

      <div class="card p-4 flex items-center gap-3 border-l-[3px] border-l-warning">
        <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0 bg-[#FFF0D0] text-[#c05621]">
          <i data-lucide="clock" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-heading text-[0.62rem] font-semibold uppercase tracking-wide text-text-muted leading-snug">Atenção</p>
          <p class="font-heading text-[1.5rem] font-bold text-[#c05621] leading-none" x-text="alertasVencendo60.length"></p>
          <p class="text-[0.68rem] text-text-muted mt-0.5">Vencendo entre 31 e 60 dias</p>
        </div>
      </div>

      <div class="card p-4 flex items-center gap-3 border-l-[3px] border-l-[#CBD5E0]">
        <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0 bg-bg-medium text-text-muted">
          <i data-lucide="briefcase" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-heading text-[0.62rem] font-semibold uppercase tracking-wide text-text-muted leading-snug">Vagas Ociosas</p>
          <p class="font-heading text-[1.5rem] font-bold text-text-main leading-none" x-text="alertasVagasOciosas.length"></p>
          <p class="text-[0.68rem] text-text-muted mt-0.5">Sem estagiário alocado</p>
        </div>
      </div>

    </div>

    <!-- Pills de filtro -->
    <div class="flex flex-wrap gap-2">
      <template x-for="pill in [
        { tipo: '',        label: 'Todos' },
        { tipo: '30d',     label: 'Crítico ≤30d' },
        { tipo: '60d',     label: 'Atenção ≤60d' },
        { tipo: 'ociosas', label: 'Vagas ociosas' },
      ]" :key="pill.tipo">
        <button @click="setAlertaFiltro(pill.tipo)"
                class="px-3 py-1.5 rounded-full text-xs font-semibold transition-colors duration-150"
                :class="alertasFiltroTipo === pill.tipo
                  ? 'bg-primary text-white'
                  : 'bg-bg-medium text-text-muted hover:bg-[#E2E8F0]'"
                x-text="pill.label">
        </button>
      </template>
    </div>

    <!-- Feed de alertas -->
    <div class="space-y-2">

      <!-- Estado vazio global -->
      <template x-if="alertasVencendo30.length === 0 && alertasVencendo60.length === 0 && alertasVagasOciosas.length === 0">
        <div class="card py-12 flex flex-col items-center justify-center gap-2 text-text-muted">
          <div class="w-11 h-11 rounded-2xl bg-bg-medium flex items-center justify-center mb-1">
            <i data-lucide="check-circle" class="w-5 h-5 text-success"></i>
          </div>
          <p class="text-sm font-medium">Nenhum alerta pendente.</p>
          <p class="text-xs">Todos os contratos e vagas estão em dia.</p>
        </div>
      </template>

      <!-- Estado vazio por filtro ativo -->
      <template x-if="alertasFiltrados.length === 0 && (alertasVencendo30.length > 0 || alertasVencendo60.length > 0 || alertasVagasOciosas.length > 0)">
        <div class="card py-10 flex flex-col items-center justify-center gap-2 text-text-muted">
          <i data-lucide="filter-x" class="w-6 h-6"></i>
          <p class="text-sm">Nenhum alerta para este filtro.</p>
        </div>
      </template>

      <!-- Itens do feed — único root por iteração para compatibilidade com x-for do Alpine -->
      <template x-for="item in alertasFiltrados" :key="item._tipo + '_' + item.id">
        <div class="card px-4 py-3.5 flex items-center gap-3 border-l-[3px]"
             :class="{
               'border-l-danger':   item._tipo === '30d',
               'border-l-warning':  item._tipo === '60d',
               'border-l-[#CBD5E0]': item._tipo === 'ociosa',
             }">

          <!-- Ícone de urgência -->
          <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
               :class="{
                 'bg-[#FFE8E8] text-danger':     item._tipo === '30d',
                 'bg-[#FFF0D0] text-[#c05621]':  item._tipo === '60d',
                 'bg-bg-medium text-text-muted':  item._tipo === 'ociosa',
               }">
            <i class="w-4 h-4"
               :data-lucide="item._tipo === '30d' ? 'alert-triangle' : item._tipo === '60d' ? 'clock' : 'briefcase'"></i>
          </div>

          <!-- Informações: contrato -->
          <div class="flex-1 min-w-0" x-show="item._tipo !== 'ociosa'">
            <p class="text-sm font-semibold text-text-main truncate" x-text="contratoEstagiarioNome(item)"></p>
            <p class="text-xs text-text-muted mt-0.5">
              <span x-text="contratoVagaCodigo(item)"></span>
              <span class="mx-1.5 opacity-40">·</span>
              <span x-text="item.tipo_contrato === 'graduacao' ? 'Graduação' : 'Pós-graduação'"></span>
              <span class="mx-1.5 opacity-40">·</span>
              vence <span x-text="new Date(item.data_fim + 'T12:00:00').toLocaleDateString('pt-BR')"></span>
            </p>
          </div>

          <!-- Informações: vaga ociosa -->
          <div class="flex-1 min-w-0" x-show="item._tipo === 'ociosa'">
            <p class="text-sm font-semibold text-text-main"
               x-text="(setores.find(s => String(s.id) === String(item.id_setor))?.sigla ?? '') + String(item.numero_vaga || '').padStart(3, '0')"></p>
            <p class="text-xs text-text-muted mt-0.5"
               x-text="setores.find(s => String(s.id) === String(item.id_setor))?.nome ?? '—'"></p>
          </div>

          <!-- Badge dias restantes (contratos) -->
          <span x-show="item._tipo !== 'ociosa'"
                class="badge flex-shrink-0"
                :class="item._tipo === '30d' ? 'badge-danger' : 'badge-warning'"
                x-text="Math.max(0, Math.floor((new Date(item.data_fim + 'T23:59:59') - Date.now()) / 86400000)) + 'd'">
          </span>

          <!-- Badge tipo (vagas ociosas) -->
          <span x-show="item._tipo === 'ociosa'"
                class="badge flex-shrink-0"
                :class="{ 'badge-info': item.tipo_vaga === 'graduacao', 'badge-primary': item.tipo_vaga === 'pos_graduacao', 'badge-success': item.tipo_vaga === 'indefinido' }"
                x-text="({ graduacao: 'Graduação', pos_graduacao: 'Pós-graduação', indefinido: 'Indefinido' })[item.tipo_vaga] ?? item.tipo_vaga">
          </span>

          <!-- Botão Ver contrato (apenas contratos) -->
          <button x-show="item._tipo !== 'ociosa'"
                  @click="irParaContrato(item)"
                  class="btn-outline flex-shrink-0 py-1.5 text-xs gap-1.5">
            Ver contrato
            <i data-lucide="arrow-right" class="w-3 h-3"></i>
          </button>

        </div>
      </template>

    </div>

  </div>
</div>
