<div class="main-content" x-show="currentView === 'alertas'" x-cloak>
  <div class="space-y-5">

    <!-- Cabeçalho -->
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <p x-show="alertasUltimaConsulta" class="text-xs text-text-muted flex items-center gap-1.5">
          <i data-lucide="clock" class="w-3 h-3"></i>
          Atualizado em: <span x-text="alertasUltimaConsulta"></span>
        </p>
      </div>
      <div class="flex flex-wrap gap-2 w-full sm:w-auto">
        <button class="btn-outline flex-1 sm:flex-none justify-center"
                @click="alertasLoaded = false; contratosLoaded = false; loadAlertas()">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Atualizar
        </button>
      </div>
    </div>

    <!-- Seção 1: Contratos vencendo em 30 dias -->
    <div class="card overflow-hidden">
      <div class="px-5 py-4 border-b border-border flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="alert-circle" class="w-4 h-4 text-danger"></i>
          <p class="font-heading text-sm uppercase font-semibold">Contratos vencendo em 30 dias</p>
        </div>
        <span class="badge" :class="alertasVencendo30.length > 0 ? 'badge-danger' : 'badge-success'"
              x-text="alertasVencendo30.length > 0 ? alertasVencendo30.length : 'Nenhum'"></span>
      </div>

      <div class="px-5 py-3 bg-bg-light hidden sm:flex items-center gap-3">
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide flex-1">Estagiário</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-24 hidden md:block">Vaga</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-28 hidden md:block">Tipo</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-28 hidden lg:block">Data Fim</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-24 text-right">Dias Restantes</p>
      </div>

      <div class="divide-y divide-border">
        <template x-if="alertasVencendo30.length === 0">
          <div class="py-10 text-center">
            <div class="w-10 h-10 rounded-2xl bg-bg-medium flex items-center justify-center mx-auto mb-3">
              <i data-lucide="check-circle" class="w-5 h-5 text-success"></i>
            </div>
            <p class="text-text-muted text-sm">Nenhum contrato vencendo nos próximos 30 dias.</p>
          </div>
        </template>
        <template x-for="c in alertasVencendo30" :key="c.id">
          <div class="px-5 py-3.5 flex items-center gap-3 hover:bg-bg-light transition-colors">
            <p class="text-sm flex-1 font-medium truncate" x-text="contratoEstagiarioNome(c)"></p>
            <p class="text-sm w-24 hidden md:block font-mono text-text-muted" x-text="contratoVagaCodigo(c)"></p>
            <div class="w-28 hidden md:block">
              <span class="badge"
                    :class="c.tipo_contrato === 'graduacao' ? 'badge-info' : 'badge-primary'"
                    x-text="c.tipo_contrato === 'graduacao' ? 'Graduação' : 'Pós-graduação'"></span>
            </div>
            <p class="text-sm w-28 hidden lg:block text-text-muted"
               x-text="new Date(c.data_fim + 'T12:00:00').toLocaleDateString('pt-BR')"></p>
            <div class="w-24 text-right">
              <span class="badge badge-danger"
                    x-text="Math.max(0, Math.floor((new Date(c.data_fim + 'T23:59:59') - Date.now()) / 86400000)) + 'd'"></span>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- Seção 2: Contratos vencendo entre 31 e 60 dias -->
    <div class="card overflow-hidden">
      <div class="px-5 py-4 border-b border-border flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="clock" class="w-4 h-4 text-warning"></i>
          <p class="font-heading text-sm uppercase font-semibold">Contratos vencendo entre 31 e 60 dias</p>
        </div>
        <span class="badge" :class="alertasVencendo60.length > 0 ? 'badge-warning' : 'badge-success'"
              x-text="alertasVencendo60.length > 0 ? alertasVencendo60.length : 'Nenhum'"></span>
      </div>

      <div class="px-5 py-3 bg-bg-light hidden sm:flex items-center gap-3">
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide flex-1">Estagiário</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-24 hidden md:block">Vaga</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-28 hidden md:block">Tipo</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-28 hidden lg:block">Data Fim</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-24 text-right">Dias Restantes</p>
      </div>

      <div class="divide-y divide-border">
        <template x-if="alertasVencendo60.length === 0">
          <div class="py-10 text-center">
            <div class="w-10 h-10 rounded-2xl bg-bg-medium flex items-center justify-center mx-auto mb-3">
              <i data-lucide="check-circle" class="w-5 h-5 text-success"></i>
            </div>
            <p class="text-text-muted text-sm">Nenhum contrato vencendo entre 31 e 60 dias.</p>
          </div>
        </template>
        <template x-for="c in alertasVencendo60" :key="c.id">
          <div class="px-5 py-3.5 flex items-center gap-3 hover:bg-bg-light transition-colors">
            <p class="text-sm flex-1 font-medium truncate" x-text="contratoEstagiarioNome(c)"></p>
            <p class="text-sm w-24 hidden md:block font-mono text-text-muted" x-text="contratoVagaCodigo(c)"></p>
            <div class="w-28 hidden md:block">
              <span class="badge"
                    :class="c.tipo_contrato === 'graduacao' ? 'badge-info' : 'badge-primary'"
                    x-text="c.tipo_contrato === 'graduacao' ? 'Graduação' : 'Pós-graduação'"></span>
            </div>
            <p class="text-sm w-28 hidden lg:block text-text-muted"
               x-text="new Date(c.data_fim + 'T12:00:00').toLocaleDateString('pt-BR')"></p>
            <div class="w-24 text-right">
              <span class="badge badge-warning"
                    x-text="Math.max(0, Math.floor((new Date(c.data_fim + 'T23:59:59') - Date.now()) / 86400000)) + 'd'"></span>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- Seção 3: Vagas ociosas -->
    <div class="card overflow-hidden">
      <div class="px-5 py-4 border-b border-border flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="briefcase" class="w-4 h-4 text-text-muted"></i>
          <p class="font-heading text-sm uppercase font-semibold">Vagas ociosas</p>
        </div>
        <span class="badge" :class="alertasVagasOciosas.length > 0 ? 'badge-warning' : 'badge-success'"
              x-text="alertasVagasOciosas.length > 0 ? alertasVagasOciosas.length : 'Nenhuma'"></span>
      </div>

      <div class="px-5 py-3 bg-bg-light hidden sm:flex items-center gap-3">
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-28">Código</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide flex-1">Setor</p>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide w-28">Tipo</p>
      </div>

      <div class="divide-y divide-border">
        <template x-if="alertasVagasOciosas.length === 0">
          <div class="py-10 text-center">
            <div class="w-10 h-10 rounded-2xl bg-bg-medium flex items-center justify-center mx-auto mb-3">
              <i data-lucide="check-circle" class="w-5 h-5 text-success"></i>
            </div>
            <p class="text-text-muted text-sm">Nenhuma vaga ociosa.</p>
          </div>
        </template>
        <template x-for="v in alertasVagasOciosas" :key="v.id">
          <div class="px-5 py-3.5 flex items-center gap-3 hover:bg-bg-light transition-colors">
            <p class="text-sm w-28 font-mono font-medium"
               x-text="(setores.find(s => String(s.id) === String(v.id_setor))?.sigla ?? '') + String(v.numero_vaga || '').padStart(3, '0')"></p>
            <p class="text-sm flex-1 text-text-muted"
               x-text="setores.find(s => String(s.id) === String(v.id_setor))?.nome ?? '—'"></p>
            <div class="w-28">
              <span class="badge"
                    :class="{ 'badge-info': v.tipo_vaga === 'graduacao', 'badge-primary': v.tipo_vaga === 'pos_graduacao', 'badge-success': v.tipo_vaga === 'indefinido' }"
                    x-text="({ graduacao: 'Graduação', pos_graduacao: 'Pós-graduação', indefinido: 'Indefinido' })[v.tipo_vaga] ?? v.tipo_vaga"></span>
            </div>
          </div>
        </template>
      </div>
    </div>

  </div>
</div>
