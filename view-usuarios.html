<template x-if="currentView === 'usuarios' && canAdmin()">
<div class="main-content" x-cloak>
  <div class="space-y-5">

    <!-- Cabeçalho da página -->
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <p x-show="usersUltimaConsulta" class="text-xs text-text-muted flex items-center gap-1.5">
          <i data-lucide="clock" class="w-3 h-3"></i>
          Atualizado em: <span x-text="usersUltimaConsulta"></span>
        </p>
      </div>
      <div class="flex flex-wrap gap-2 w-full sm:w-auto">
        <button class="btn-outline flex-1 sm:flex-none justify-center" @click="loadUsers()">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Atualizar
        </button>
        <template x-if="canEdit()">
          <button class="btn-outline flex-1 sm:flex-none justify-center"
                  @click="exportarPdfUsuarios()"
                  :disabled="exportandoPdf || !usersFiltered.length"
                  :title="!usersFiltered.length ? 'Nenhum dado para exportar' : ''">
            <i data-lucide="loader-2" class="w-4 h-4 animate-spin" x-show="exportandoPdf"></i>
            <i data-lucide="download" class="w-4 h-4" x-show="!exportandoPdf"></i>
            <span x-text="exportandoPdf ? 'Gerando...' : 'Exportar PDF'"></span>
          </button>
        </template>
        <button class="btn-primary flex-1 sm:flex-none justify-center"
                @click="openModal({
                  title: 'Adicionar Usuário',
                  size: 'sm', contentKey: 'addUser',
                  confirmLabel: 'Adicionar',
                  onConfirm: () => addUser(),
                })">
          <i data-lucide="user-plus" class="w-4 h-4"></i>
          Novo Usuário
        </button>
      </div>
    </div>

    <!-- Filtros -->
    <div class="card px-5 py-4">
      <div class="flex flex-col sm:flex-row gap-2.5">
        <div class="relative flex-1">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-text-muted pointer-events-none"></i>
          <input type="text"
                 x-model="userSearch"
                 placeholder="Buscar por e-mail..."
                 class="form-input pl-9 pr-9 w-full" />
          <button type="button"
                  x-show="userSearch"
                  @click="userSearch = ''"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-text-main transition-colors">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <select x-model="userRoleFilter" class="select-input w-full sm:w-44">
          <option value="">Todos os perfis</option>
          <option value="admin">Admin</option>
          <option value="editor">Editor</option>
          <option value="viewer">Visualizador</option>
        </select>
      </div>
    </div>

    <!-- Badges de filtros ativos -->
    <div x-show="userSearch || userRoleFilter"
         class="flex flex-wrap items-center gap-2">
      <button type="button"
              @click="userSearch = ''; userRoleFilter = ''"
              class="btn-outline text-xs py-1 px-2.5">
        Limpar filtros
      </button>
      <template x-if="userSearch">
        <span class="flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-primary/10 text-primary border border-primary/20">
          <span x-text="'Busca: ' + userSearch"></span>
          <button type="button" @click="userSearch = ''">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </span>
      </template>
      <template x-if="userRoleFilter">
        <span class="flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-primary/10 text-primary border border-primary/20">
          <span x-text="'Perfil: ' + ({ admin: 'Admin', editor: 'Editor', viewer: 'Visualizador' }[userRoleFilter] || userRoleFilter)"></span>
          <button type="button" @click="userRoleFilter = ''">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </span>
      </template>
    </div>

    <!-- Card principal -->
    <div class="card overflow-hidden">

      <div class="overflow-x-auto">
        <table class="w-full border-collapse">

          <!-- Cabeçalho -->
          <thead>
            <tr class="bg-bg-light border-b border-border">

              <!-- Avatar (espaçador) -->
              <th class="px-5 py-3.5 w-12"></th>

              <!-- Usuário (sortável) -->
              <th class="px-5 py-3.5 text-left">
                <button class="flex items-center gap-1 group"
                        @click="usersSortBy === 'email' ? usersSortDir = (usersSortDir === 'asc' ? 'desc' : 'asc') : (usersSortBy = 'email', usersSortDir = 'asc')"
                        :title="usersSortBy === 'email' ? (usersSortDir === 'asc' ? 'Ordenado por e-mail A→Z. Clique para inverter.' : 'Ordenado por e-mail Z→A. Clique para inverter.') : 'Clique para ordenar por e-mail'">
                  <span class="text-xs font-semibold text-text-muted uppercase tracking-wide group-hover:text-primary transition-colors">Usuário</span>
                  <i class="w-3 h-3 text-text-muted group-hover:text-primary transition-colors"
                     :data-lucide="usersSortBy === 'email' ? (usersSortDir === 'asc' ? 'arrow-up' : 'arrow-down') : 'arrow-up-down'"></i>
                </button>
              </th>

              <!-- Ações -->
              <th class="px-5 py-3.5 text-right w-28">
                <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Ações</span>
              </th>

            </tr>
          </thead>

          <!-- Body -->
          <tbody class="divide-y divide-border">

            <!-- Estado vazio -->
            <template x-if="usersFiltered.length === 0">
              <tr>
                <td colspan="3" class="py-16 text-center">
                  <div class="w-12 h-12 rounded-2xl bg-bg-medium flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="users" class="w-6 h-6 text-text-muted"></i>
                  </div>
                  <p class="text-text-muted text-sm">Nenhum usuário encontrado.</p>
                </td>
              </tr>
            </template>

            <!-- Linhas -->
            <template x-for="u in usersPaged" :key="u.email">
              <tr class="hover:bg-bg-light transition-colors">

                <!-- Avatar -->
                <td class="px-5 py-3.5 w-12">
                  <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-primary to-info
                              flex items-center justify-center text-white text-sm font-bold"
                       x-text="u.email.charAt(0).toUpperCase()"></div>
                </td>

                <!-- Usuário -->
                <td class="px-5 py-3.5">
                  <div class="flex items-center gap-2 overflow-hidden">
                    <p class="text-sm font-medium text-text-main truncate" x-text="u.email"></p>
                    <span class="badge hidden sm:inline-flex flex-shrink-0"
                          :class="roleBadgeClass(u.role)"
                          x-text="roleBadgeLabel(u.role)"></span>
                  </div>
                  <!-- Mobile: badge abaixo do email -->
                  <span class="badge sm:hidden mt-1"
                        :class="roleBadgeClass(u.role)"
                        x-text="roleBadgeLabel(u.role)"></span>
                </td>

                <!-- Ações -->
                <td class="px-5 py-3.5 w-28">
                  <div class="flex items-center gap-1 justify-end">
                    <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center
                                   text-text-muted hover:border-primary hover:text-primary transition-all"
                            @click="openViewUser(u)"
                            title="Visualizar usuário">
                      <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                    <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center
                                   text-text-muted hover:border-primary hover:text-primary transition-all"
                            :class="{ 'opacity-30 cursor-not-allowed': u.email === userEmail }"
                            :disabled="u.email === userEmail"
                            @click="openEditUser(u)"
                            title="Editar usuário">
                      <i data-lucide="pencil" class="w-4 h-4"></i>
                    </button>
                    <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center
                                   text-text-muted hover:border-red-300 hover:text-red-500 transition-all"
                            :class="{ 'opacity-30 cursor-not-allowed': u.email === userEmail }"
                            :disabled="u.email === userEmail"
                            @click="removeUser(u.email)"
                            title="Remover usuário">
                      <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                  </div>
                </td>

              </tr>
            </template>

          </tbody>
        </table>
      </div>

      <!-- Rodapé -->
      <div class="px-5 py-3 border-t border-border flex flex-col sm:flex-row items-center justify-between gap-3"
           x-show="usersFiltered.length > 0">
        <div class="flex items-center gap-2 text-xs text-text-muted">
          <strong x-text="usersFiltered.length"></strong>
          <span x-text="usersFiltered.length === 1 ? 'registro' : 'registros'"></span>
          <span class="text-border">·</span>
          <span>Exibindo</span>
          <select x-model.number="usersPerPage"
                  @change="usersPage = 1"
                  class="select-input text-xs py-1 px-2 w-16">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
          <span>por página</span>
        </div>
        <div class="flex items-center gap-1">
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="usersPage === 1" @click="usersPage = 1" title="Primeira página">
            <i data-lucide="chevrons-left" class="w-3.5 h-3.5"></i>
          </button>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="usersPage === 1" @click="usersPage--" title="Anterior">
            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
          </button>
          <span class="text-xs text-text-muted px-2">
            <strong x-text="usersPage"></strong> / <strong x-text="usersTotalPages"></strong>
          </span>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="usersPage === usersTotalPages" @click="usersPage++" title="Próxima">
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </button>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="usersPage === usersTotalPages" @click="usersPage = usersTotalPages" title="Última">
            <i data-lucide="chevrons-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
</template>
