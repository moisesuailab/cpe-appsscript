<div class="main-content" x-show="currentView === 'contratos'" x-cloak>
  <div class="space-y-5">

    <!-- Cabeçalho -->
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <p x-show="contratosUltimaConsulta" class="text-xs text-text-muted flex items-center gap-1.5">
          <i data-lucide="clock" class="w-3 h-3"></i>
          Atualizado em: <span x-text="contratosUltimaConsulta"></span>
        </p>
      </div>
      <div class="flex flex-wrap gap-2 w-full sm:w-auto">
        <button class="btn-outline flex-1 sm:flex-none justify-center" @click="loadContratos()">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Atualizar
        </button>
        <template x-if="canEdit()">
          <button class="btn-primary flex-1 sm:flex-none justify-center" @click="openAddContrato()">
            <i data-lucide="plus" class="w-4 h-4"></i>
            Novo Contrato
          </button>
        </template>
      </div>
    </div>

    <!-- Filtros -->
    <div class="card px-5 py-4">
      <div class="flex flex-col sm:flex-row gap-2.5">
        <div class="relative flex-1">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-text-muted pointer-events-none"></i>
          <input type="text"
                 x-model="contratosSearch"
                 placeholder="Buscar por estagiário ou código da vaga..."
                 class="form-input pl-9 pr-9 w-full" />
          <button type="button"
                  x-show="contratosSearch"
                  @click="contratosSearch = ''"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-text-main transition-colors">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <select x-model="contratosFiltroStatus" class="select-input sm:w-44">
          <option value="">Todos os status</option>
          <option value="Ativo">Ativo</option>
          <option value="Não iniciado">Não iniciado</option>
          <option value="Encerrado">Encerrado</option>
        </select>
        <select x-model="contratosFiltroTipo" class="select-input sm:w-44">
          <option value="">Todos os tipos</option>
          <option value="graduacao">Graduação</option>
          <option value="pos_graduacao">Pós-Graduação</option>
        </select>
      </div>
    </div>

    <!-- Badges de filtros ativos -->
    <div x-show="contratosSearch || contratosFiltroStatus || contratosFiltroTipo"
         class="flex flex-wrap items-center gap-2">
      <button type="button"
              @click="contratosSearch = ''; contratosFiltroStatus = ''; contratosFiltroTipo = ''"
              class="btn-outline text-xs py-1 px-2.5">
        Limpar filtros
      </button>
      <template x-if="contratosSearch">
        <span class="flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-primary/10 text-primary border border-primary/20">
          <span x-text="'Busca: ' + contratosSearch"></span>
          <button type="button" @click="contratosSearch = ''">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </span>
      </template>
      <template x-if="contratosFiltroStatus">
        <span class="flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-primary/10 text-primary border border-primary/20">
          <span x-text="'Status: ' + contratosFiltroStatus"></span>
          <button type="button" @click="contratosFiltroStatus = ''">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </span>
      </template>
      <template x-if="contratosFiltroTipo">
        <span class="flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-primary/10 text-primary border border-primary/20">
          <span x-text="'Tipo: ' + ({ graduacao: 'Graduação', pos_graduacao: 'Pós-Graduação' }[contratosFiltroTipo] || contratosFiltroTipo)"></span>
          <button type="button" @click="contratosFiltroTipo = ''">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </span>
      </template>
    </div>

    <!-- Card principal -->
    <div class="card overflow-hidden">

      <div class="overflow-x-auto">
        <table class="w-full border-collapse">

          <!-- Cabeçalho -->
          <thead>
            <tr class="bg-bg-light border-b border-border">

              <!-- Estagiário (sortável) -->
              <th class="px-5 py-3.5 text-left">
                <button class="flex items-center gap-1 group"
                        @click="contratosSortBy === 'estagiario' ? contratosSortDir = (contratosSortDir === 'asc' ? 'desc' : 'asc') : (contratosSortBy = 'estagiario', contratosSortDir = 'asc')"
                        :title="contratosSortBy === 'estagiario' ? (contratosSortDir === 'asc' ? 'Ordenado por estagiário A→Z. Clique para inverter.' : 'Ordenado por estagiário Z→A. Clique para inverter.') : 'Clique para ordenar por estagiário'">
                  <span class="text-xs font-semibold text-text-muted uppercase tracking-wide group-hover:text-primary transition-colors">Estagiário</span>
                  <i class="w-3 h-3 text-text-muted group-hover:text-primary transition-colors"
                     :data-lucide="contratosSortBy === 'estagiario' ? (contratosSortDir === 'asc' ? 'arrow-up' : 'arrow-down') : 'arrow-up-down'"></i>
                </button>
              </th>

              <!-- Vaga -->
              <th class="px-5 py-3.5 text-left w-24 hidden md:table-cell">
                <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Vaga</span>
              </th>

              <!-- Tipo -->
              <th class="px-5 py-3.5 text-left w-40 hidden md:table-cell">
                <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Tipo</span>
              </th>

              <!-- Data Início (sortável) -->
              <th class="px-5 py-3.5 text-left w-32 hidden lg:table-cell">
                <button class="flex items-center gap-1 group"
                        @click="contratosSortBy === 'data_inicio' ? contratosSortDir = (contratosSortDir === 'asc' ? 'desc' : 'asc') : (contratosSortBy = 'data_inicio', contratosSortDir = 'asc')"
                        :title="contratosSortBy === 'data_inicio' ? (contratosSortDir === 'asc' ? 'Ordenado por data de início crescente. Clique para inverter.' : 'Ordenado por data de início decrescente. Clique para inverter.') : 'Clique para ordenar por data de início'">
                  <span class="text-xs font-semibold text-text-muted uppercase tracking-wide group-hover:text-primary transition-colors">Início</span>
                  <i class="w-3 h-3 text-text-muted group-hover:text-primary transition-colors"
                     :data-lucide="contratosSortBy === 'data_inicio' ? (contratosSortDir === 'asc' ? 'arrow-up' : 'arrow-down') : 'arrow-up-down'"></i>
                </button>
              </th>

              <!-- Data Fim (sortável) -->
              <th class="px-5 py-3.5 text-left w-32 hidden lg:table-cell">
                <button class="flex items-center gap-1 group"
                        @click="contratosSortBy === 'data_fim' ? contratosSortDir = (contratosSortDir === 'asc' ? 'desc' : 'asc') : (contratosSortBy = 'data_fim', contratosSortDir = 'asc')"
                        :title="contratosSortBy === 'data_fim' ? (contratosSortDir === 'asc' ? 'Ordenado por data de fim crescente. Clique para inverter.' : 'Ordenado por data de fim decrescente. Clique para inverter.') : 'Clique para ordenar por data de fim'">
                  <span class="text-xs font-semibold text-text-muted uppercase tracking-wide group-hover:text-primary transition-colors">Fim</span>
                  <i class="w-3 h-3 text-text-muted group-hover:text-primary transition-colors"
                     :data-lucide="contratosSortBy === 'data_fim' ? (contratosSortDir === 'asc' ? 'arrow-up' : 'arrow-down') : 'arrow-up-down'"></i>
                </button>
              </th>

              <!-- Status -->
              <th class="px-5 py-3.5 text-left w-32">
                <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Status</span>
              </th>

              <!-- Ações -->
              <th class="px-5 py-3.5 text-right w-20">
                <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Ações</span>
              </th>

            </tr>
          </thead>

          <!-- Body -->
          <tbody class="divide-y divide-border">

            <!-- Estado vazio -->
            <template x-if="contratosFiltrados.length === 0">
              <tr>
                <td colspan="7" class="py-16 text-center">
                  <div class="w-12 h-12 rounded-2xl bg-bg-medium flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="file-text" class="w-6 h-6 text-text-muted"></i>
                  </div>
                  <p class="text-text-muted text-sm">Nenhum contrato encontrado.</p>
                </td>
              </tr>
            </template>

            <!-- Linhas -->
            <template x-for="c in contratosPaged" :key="c.id">
              <tr class="hover:bg-bg-light transition-colors">

                <!-- Estagiário -->
                <td class="px-5 py-3.5">
                  <p class="text-sm font-medium text-text-main truncate" x-text="contratoEstagiarioNome(c)"></p>
                  <!-- Mobile: vaga e datas abaixo do nome -->
                  <p class="text-xs text-text-muted font-mono mt-0.5 md:hidden" x-text="contratoVagaCodigo(c)"></p>
                </td>

                <!-- Vaga -->
                <td class="px-5 py-3.5 w-24 hidden md:table-cell">
                  <p class="text-sm font-mono text-text-main" x-text="contratoVagaCodigo(c)"></p>
                </td>

                <!-- Tipo -->
                <td class="px-5 py-3.5 w-32 hidden md:table-cell">
                  <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium"
                        :class="{
                          'bg-blue-50 text-blue-700': c.tipo_contrato === 'graduacao',
                          'bg-purple-50 text-purple-700': c.tipo_contrato === 'pos_graduacao'
                        }"
                        x-text="c.tipo_contrato === 'graduacao' ? 'Graduação' : 'Pós-Graduação'">
                  </span>
                </td>

                <!-- Data Início -->
                <td class="px-5 py-3.5 w-32 hidden lg:table-cell">
                  <p class="text-sm text-text-main" x-text="contratoDataFormatada(c.data_inicio)"></p>
                </td>

                <!-- Data Fim -->
                <td class="px-5 py-3.5 w-32 hidden lg:table-cell">
                  <p class="text-sm text-text-main" x-text="contratoDataFormatada(c.data_fim)"></p>
                </td>

                <!-- Status -->
                <td class="px-5 py-3.5 w-28">
                  <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium"
                        :class="{
                          'bg-green-50 text-green-700':  contratoStatus(c) === 'Ativo',
                          'bg-amber-50 text-amber-700':  contratoStatus(c) === 'Não iniciado',
                          'bg-gray-100 text-gray-500':   contratoStatus(c) === 'Encerrado'
                        }"
                        x-text="contratoStatus(c)">
                  </span>
                </td>

                <!-- Ações -->
                <td class="px-5 py-3.5 w-20">
                  <div class="flex items-center gap-1 justify-end">
                    <template x-if="canEdit()">
                      <span class="flex items-center gap-1">
                        <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center
                                       text-text-muted hover:border-primary hover:text-primary transition-all"
                                @click="openEditContrato(c)" title="Editar contrato">
                          <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center
                                       text-text-muted hover:border-red-300 hover:text-red-500 transition-all"
                                @click="deleteContrato(c)" title="Excluir contrato">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      </span>
                    </template>
                  </div>
                </td>

              </tr>
            </template>

          </tbody>
        </table>
      </div>

      <!-- Rodapé com paginação -->
      <div class="px-5 py-3 border-t border-border flex flex-col sm:flex-row items-center justify-between gap-3"
           x-show="contratosFiltrados.length > 0">
        <div class="flex items-center gap-2 text-xs text-text-muted">
          <strong x-text="contratosFiltrados.length"></strong>
          <span x-text="contratosFiltrados.length === 1 ? 'registro' : 'registros'"></span>
          <span class="text-border">·</span>
          <span>Exibindo</span>
          <select x-model.number="contratosPerPage"
                  @change="contratosPage = 1"
                  class="select-input text-xs py-1 px-2 w-16">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
          <span>por página</span>
        </div>
        <div class="flex items-center gap-1">
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="contratosPage === 1" @click="contratosPage = 1" title="Primeira página">
            <i data-lucide="chevrons-left" class="w-3.5 h-3.5"></i>
          </button>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="contratosPage === 1" @click="contratosPage--" title="Anterior">
            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
          </button>
          <span class="text-xs text-text-muted px-2">
            <strong x-text="contratosPage"></strong> / <strong x-text="contratosTotalPages"></strong>
          </span>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="contratosPage === contratosTotalPages" @click="contratosPage++" title="Próxima">
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </button>
          <button class="w-7 h-7 rounded border border-border flex items-center justify-center
                         text-text-muted hover:border-primary hover:text-primary transition-all
                         disabled:opacity-30 disabled:cursor-not-allowed"
                  :disabled="contratosPage === contratosTotalPages" @click="contratosPage = contratosTotalPages" title="Última">
            <i data-lucide="chevrons-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
