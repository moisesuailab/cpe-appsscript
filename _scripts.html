<script defer src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js"></script>

<script>
  const DATA = (typeof INITIAL_DATA !== 'undefined') ? INITIAL_DATA : { userEmail: 'user@exemplo.com', alertasCount: 0, userRole: 'viewer' };

  const ROLES = {
    ADMIN:  'admin',
    EDITOR: 'editor',
    VIEWER: 'viewer',

    CONFIG: {
      admin:  { label: 'Administrador', badgeLabel: 'Admin',         badgeClass: 'badge-primary' },
      editor: { label: 'Editor',        badgeLabel: 'Editor',        badgeClass: 'badge-info'    },
      viewer: { label: 'Visualizador',  badgeLabel: 'Visualizador',  badgeClass: 'badge-success' },
    },

    get(role) { return this.CONFIG[role] || null; },
    label(role) { return this.CONFIG[role]?.label || 'Sem acesso'; },
    badgeLabel(role) { return this.CONFIG[role]?.badgeLabel || role; },
    badgeClass(role) { return this.CONFIG[role]?.badgeClass || 'badge-primary'; },
  };

  const ListUtils = {

    filter(items, search, searchFields, filterValue, filterField) {
      const term = search.toLowerCase().trim();
      return items.filter(item => {
        const matchSearch = !term || searchFields.some(f =>
          String(item[f] ?? '').toLowerCase().includes(term)
        );
        const matchFilter = !filterValue || item[filterField] === filterValue;
        return matchSearch && matchFilter;
      });
    },

    totalPages(filteredLength, perPage) {
      return Math.max(1, Math.ceil(filteredLength / perPage));
    },

    paged(filtered, page, perPage) {
      const start = (page - 1) * perPage;
      return filtered.slice(start, start + perPage);
    },

  };

  function usersModule() {
    return {
      users:                [],
      newUser:              { email: '', role: ROLES.VIEWER },
      userSearch:           '',
      userRoleFilter:       '',
      usersSortBy:          'email',
      usersSortDir:         'asc',
      usersPage:            1,
      usersPerPage:         10,
      editingUser:          { email: '', role: ROLES.VIEWER },
      usersUltimaConsulta:  null,

      initUsers() {
        ['userSearch', 'userRoleFilter', 'usersSortBy', 'usersSortDir'].forEach(w => {
          this.$watch(w, () => { this.usersPage = 1; this.$nextTick(() => lucide.createIcons()); });
        });
        this.$watch('usersPage',    () => { this.$nextTick(() => lucide.createIcons()); });
        this.$watch('usersPerPage', () => { this.$nextTick(() => lucide.createIcons()); });

        window.addEventListener('app:navigate', (e) => {
          if (e.detail.viewId === 'usuarios' && this.users.length === 0) this.loadUsers();
        });
      },

      loadUsers() {
        Loading.show('Carregando usuários...');
        google.script.run
          .withSuccessHandler((data) => {
            this.users = data || [];
            this.usersUltimaConsulta = this._agora();
            Loading.hide();
            this.$nextTick(() => lucide.createIcons());
          })
          .withFailureHandler((err) => {
            Loading.hide();
            Toast.error(err.message || 'Erro ao carregar usuários.');
          })
          .userGetAll();
      },

      addUser() {
        if (!this.newUser.email) return Toast.warning('Informe um e-mail.');
        Loading.show('Adicionando usuário...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              this.users.push({ email: this.newUser.email, role: this.newUser.role });
              this.newUser = { email: '', role: ROLES.VIEWER };
              this.closeModal();
              Toast.success(res.message);
              this.$nextTick(() => lucide.createIcons());
            } else {
              Toast.error(res.message);
            }
          })
          .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
          .userAdd(this.newUser.email, this.newUser.role);
      },

      saveEditUser() {
        Loading.show('Atualizando perfil...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              const u = this.users.find(u => u.email === this.editingUser.email);
              if (u) u.role = this.editingUser.role;
              this.closeModal();
              Toast.success(res.message);
            } else {
              Toast.error(res.message);
            }
          })
          .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
          .userUpdateRole(this.editingUser.email, this.editingUser.role);
      },

      removeUser(email) {
        this.showConfirm({
          message:      'Remover usuário?',
          detail:       `O e-mail '${email}' perderá o acesso imediatamente.`,
          confirmLabel: 'Remover',
          variant:      'danger',
          onConfirm: () => {
            Loading.show('Removendo usuário...');
            google.script.run
              .withSuccessHandler((res) => {
                Loading.hide();
                if (res.status === 'success') {
                  this.users = this.users.filter(u => u.email !== email);
                  Toast.success(res.message);
                } else {
                  Toast.error(res.message);
                }
              })
              .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
              .userRemove(email);
          },
        });
      },

      openViewUser(u) {
        this.editingUser = { ...u };
        this.openModal({
          title:       'Detalhes do Usuário',
          size:        'sm',
          contentKey:  'viewUser',
          cancelLabel: 'Fechar',
          showConfirm: false,
        });
      },

      openEditUser(u) {
        this.editingUser = { ...u };
        this.openModal({
          title:        'Editar Usuário',
          size:         'sm',
          contentKey:   'editUser',
          confirmLabel: 'Salvar',
          onConfirm:    () => this.saveEditUser(),
        });
      },
    };
  }

  function composicaoModule() {
    return {
      grupos:    [],
      orgaos:    [],
      cargos:    [],
      ocupacoes: [],
      magistrados: [],
      composicaoLoaded:         false,
      composicaoUltimaConsulta: null,
      composicaoPanelLevel:     1,
      selectedGrupo: null,
      selectedOrgao: null,
      composicaoSearch: '',

      novoGrupo:            { nome: '', descricao: '' },
      editGrupo:            { id: '', nome: '', descricao: '' },
      novoOrgao:            { nome: '' },
      editOrgao:            { id: '', nome: '' },
      novoCargo:            { nome: '', tipo: 'titular' },
      editCargo:            { id: '', nome: '', tipo: '' },
      novaOcupacao: { id_cargo: '', id_magistrado: '' },

      initComposicao() {
        this.$watch('composicaoSearch', () => { this.$nextTick(() => lucide.createIcons()); });
        window.addEventListener('app:navigate', (e) => {
          if (e.detail.viewId === 'composicao' && !this.composicaoLoaded) this.loadComposicao();
        });
      },

      loadComposicao(message = 'Carregando composição...') {
        Loading.show(message);
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              const c = res.data.collections;
              this.grupos      = c.grupos      || [];
              this.orgaos      = c.orgaos      || [];
              this.cargos      = c.cargos      || [];
              this.ocupacoes   = c.ocupacoes   || [];
              this.magistrados = c.magistrados || [];
              this.composicaoLoaded         = true;
              this.composicaoUltimaConsulta = this._agora();
            } else Toast.error(res.message);
            this.$nextTick(() => lucide.createIcons());
          })
          .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
          .getAppData(['grupos', 'orgaos', 'cargos', 'ocupacoes', 'magistrados']);
      },

      selectGrupo(grupo) {
        this.selectedGrupo = grupo;
        this.selectedOrgao = null;
        if (window.innerWidth < 768) this.composicaoPanelLevel = 2;
        this.$nextTick(() => lucide.createIcons());
      },

      selectOrgao(orgao) {
        this.selectedOrgao = orgao;
        if (window.innerWidth < 768) this.composicaoPanelLevel = 3;
        this.$nextTick(() => lucide.createIcons());
      },

      // --- Grupo ---

      openAddGrupo() {
        this.novoGrupo = { nome: '', descricao: '' };
        this.openModal({ title: 'Novo Grupo', size: 'sm', contentKey: 'addGrupo', confirmLabel: 'Criar', onConfirm: () => this.saveAddGrupo() });
      },

      saveAddGrupo() {
        Loading.show('Salvando grupo...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              this.grupos.push(res.data);
              this.closeModal();
              Toast.success('Grupo criado com sucesso.');
              this.$nextTick(() => lucide.createIcons());
            } else Toast.error(res.message);
          })
          .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
          .grupoCreate(this.novoGrupo);
      },

      openEditGrupo(grupo) {
        this.editGrupo = { ...grupo };
        this.openModal({ title: 'Editar Grupo', size: 'sm', contentKey: 'editGrupo', confirmLabel: 'Salvar', onConfirm: () => this.saveEditGrupo() });
      },

      saveEditGrupo() {
        Loading.show('Salvando grupo...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              const idx = this.grupos.findIndex(g => g.id === this.editGrupo.id);
              if (idx !== -1) this.grupos[idx] = res.data;
              if (this.selectedGrupo?.id === this.editGrupo.id) this.selectedGrupo = res.data;
              this.closeModal();
              Toast.success('Grupo atualizado com sucesso.');
              this.$nextTick(() => lucide.createIcons());
            } else Toast.error(res.message);
          })
          .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
          .grupoUpdate(this.editGrupo.id, this.editGrupo);
      },

      deleteGrupo(grupo) {
        this.showConfirm({
          message: 'Excluir grupo?',
          detail: `O grupo '${grupo.nome}' será removido permanentemente.`,
          confirmLabel: 'Excluir',
          variant: 'danger',
          onConfirm: () => {
            Loading.show('Excluindo grupo...');
            google.script.run
              .withSuccessHandler((res) => {
                Loading.hide();
                if (res.status === 'success') {
                  this.grupos = this.grupos.filter(g => g.id !== grupo.id);
                  if (this.selectedGrupo?.id === grupo.id) { this.selectedGrupo = null; this.selectedOrgao = null; }
                  Toast.success('Grupo excluído com sucesso.');
                  this.$nextTick(() => lucide.createIcons());
                } else Toast.error(res.message);
              })
              .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
              .grupoDelete(grupo.id);
          },
        });
      },

      // --- Órgão ---

      openAddOrgao() {
        this.novoOrgao = { nome: '' };
        this.openModal({ title: 'Novo Órgão', size: 'sm', contentKey: 'addOrgao', confirmLabel: 'Criar', onConfirm: () => this.saveAddOrgao() });
      },

      saveAddOrgao() {
        Loading.show('Salvando órgão...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              this.orgaos.push(res.data);
              this.closeModal();
              Toast.success('Órgão criado com sucesso.');
              this.$nextTick(() => lucide.createIcons());

          .orgaoCreate({ ...this.novoOrgao, id_grupo: this.selectedGrupo.id });
      },

      openEditOrgao(orgao) {
        this.editOrgao = { ...orgao };
        this.openModal({ title: 'Editar Órgão', size: 'sm', contentKey: 'editOrgao', confirmLabel: 'Salvar', onConfirm: () => this.saveEditOrgao() });
      },

      saveEditOrgao() {
        Loading.show('Salvando órgão...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              const idx = this.orgaos.findIndex(o => o.id === this.editOrgao.id);
              if (idx !== -1) this.orgaos[idx] = res.data;
              if (this.selectedOrgao?.id === this.editOrgao.id) this.selectedOrgao = res.data;
              this.closeModal();
              Toast.success('Órgão atualizado com sucesso.');
              this.$nextTick(() => lucide.createIcons());
            } else Toast.error(res.message);
          })
          .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
          .orgaoUpdate(this.editOrgao.id, this.editOrgao);
      },

      deleteOrgao(orgao) {
        this.showConfirm({
          message: 'Excluir órgão?',
          detail: `O órgão '${orgao.nome}' será removido permanentemente.`,
          confirmLabel: 'Excluir',
          variant: 'danger',
          onConfirm: () => {
            Loading.show('Excluindo órgão...');
            google.script.run
              .withSuccessHandler((res) => {
                Loading.hide();
                if (res.status === 'success') {
                  this.orgaos = this.orgaos.filter(o => o.id !== orgao.id);
                  if (this.selectedOrgao?.id === orgao.id) this.selectedOrgao = null;
                  Toast.success('Órgão excluído com sucesso.');
                  this.$nextTick(() => lucide.createIcons());
                } else Toast.error(res.message);
              })
              .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
              .orgaoDelete(orgao.id);
          },
        });
      },

      // --- Cargo ---

      openAddCargo() {
        this.novoCargo = { nome: '', tipo: 'titular' };
        this.openModal({ title: 'Novo Cargo', size: 'sm', contentKey: 'addCargo', confirmLabel: 'Criar', onConfirm: () => this.saveAddCargo() });
      },

      saveAddCargo() {
        Loading.show('Salvando cargo...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              this.cargos.push(res.data);
              this.closeModal();
              Toast.success('Cargo criado com sucesso.');
              this.$nextTick(() => lucide.createIcons());
            } else Toast.error(res.message);
          })
          .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
          .cargoCreate({ ...this.novoCargo, id_orgao: this.selectedOrgao.id });
      },

      openEditCargo(cargo) {
        this.editCargo = { ...cargo };
        this.openModal({ title: 'Editar Cargo', size: 'sm', contentKey: 'editCargo', confirmLabel: 'Salvar', onConfirm: () => this.saveEditCargo() });
      },

      saveEditCargo() {
        Loading.show('Salvando cargo...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              const idx = this.cargos.findIndex(c => c.id === this.editCargo.id);
              if (idx !== -1) this.cargos[idx] = res.data;
              this.closeModal();
              Toast.success('Cargo atualizado com sucesso.');
              this.$nextTick(() => lucide.createIcons());
            } else Toast.error(res.message);
          })
          .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
          .cargoUpdate(this.editCargo.id, this.editCargo);
      },

      deleteCargo(cargo) {
        this.showConfirm({
          message: 'Excluir cargo?',
          detail: `O cargo '${cargo.nome}' será removido permanentemente.`,
          confirmLabel: 'Excluir',
          variant: 'danger',
          onConfirm: () => {
            Loading.show('Excluindo cargo...');
            google.script.run
              .withSuccessHandler((res) => {
                Loading.hide();
                if (res.status === 'success') {
                  this.cargos = this.cargos.filter(c => c.id !== cargo.id);
                  Toast.success('Cargo excluído com sucesso.');
                  this.$nextTick(() => lucide.createIcons());
                } else Toast.error(res.message);
              })
              .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
              .cargoDelete(cargo.id);
          },
        });
      },

      setCargoPresidente(cargo) {
        Loading.show('Atualizando presidente...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              this.cargos = this.cargos.map(c => ({
                ...c,
                is_presidente: c.id_orgao === cargo.id_orgao
                  ? (c.id === cargo.id ? 'TRUE' : 'FALSE')
                  : c.is_presidente,
              }));
              Toast.success('Presidente atualizado.');
              this.$nextTick(() => lucide.createIcons());
            } else Toast.error(res.message);
          })
          .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
          .cargoSetPresidente(cargo.id);
      },

      // --- Ocupação ---

      openVincularMagistrado(cargo) {
        this.novaOcupacao = { id_cargo: cargo.id, id_magistrado: '' };
        this.openModal({ title: 'Vincular Magistrado', size: 'md', contentKey: 'vincularMagistrado', confirmLabel: 'Vincular', onConfirm: () => this.saveVincularMagistrado() });
      },

      saveVincularMagistrado() {
        Loading.show('Vinculando magistrado...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              const idx = this.ocupacoes.findIndex(o => String(o.id_cargo) === String(res.data.id_cargo));
              if (idx !== -1) this.ocupacoes[idx] = res.data;
              else this.ocupacoes.push(res.data);
              this.closeModal();
              Toast.success('Magistrado vinculado com sucesso.');
              this.$nextTick(() => lucide.createIcons());
            } else Toast.error(res.message);
          })
          .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
          .ocupacaoCreate({ id_cargo: this.novaOcupacao.id_cargo, id_magistrado: this.novaOcupacao.id_magistrado });
      },

      removerMagistrado(cargo) {
        const ocupacao = this.getOcupacaoAtiva(cargo.id);
        if (!ocupacao) return Toast.warning('Nenhuma ocupação encontrada para este cargo.');
        this.showConfirm({
          message: 'Remover magistrado do cargo?',
          detail: `${this.getMagistradoNome(ocupacao.id_magistrado)} será desvinculado de "${cargo.nome}".`,
          confirmLabel: 'Remover',
          variant: 'danger',
          onConfirm: () => {
            Loading.show('Removendo magistrado...');
            google.script.run
              .withSuccessHandler((res) => {
                Loading.hide();
                if (res.status === 'success') {
                  this.ocupacoes = this.ocupacoes.filter(o => o.id !== ocupacao.id);
                  Toast.success('Magistrado removido com sucesso.');
                  this.$nextTick(() => lucide.createIcons());
                } else Toast.error(res.message);
              })
              .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
              .ocupacaoRemover(ocupacao.id);
          },
        });
      },

      // --- Helpers ---

      getOcupacaoAtiva(idCargo) {
        return this.ocupacoes.find(o => String(o.id_cargo) === String(idCargo)) || null;
      },

      magistradosDisponiveisParaVincular() {
        if (!this.selectedOrgao) return this.magistrados;
        const cargosDoOrgao = this.cargos
          .filter(c => String(c.id_orgao) === String(this.selectedOrgao.id))
          .map(c => String(c.id));
        const idsMagistradosOcupados = this.ocupacoes
          .filter(o => cargosDoOrgao.includes(String(o.id_cargo)))
          .map(o => String(o.id_magistrado));
        return this.magistrados.filter(m => !idsMagistradosOcupados.includes(String(m.id)));
      },

      getMagistradoNome(idMagistrado) {
        const m = this.magistrados.find(m => String(m.id) === String(idMagistrado));
        return m ? m.nome : '—';
      },

      _agora() {
        return new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
      },
    };
  }

  function magistradosModule() {
    return {
      magistradoSearch:   '',
      magistradosSortBy:  'nome',
      magistradosSortDir: 'asc',
      magistradosPage:    1,
      magistradosPerPage: 10,

      novoMagistrado:  { nome: '', matricula: '', cidade: '' },
      editMagistrado:  { id: '', nome: '', matricula: '', cidade: '' },
      viewMagistrado:  { id: '', nome: '', matricula: '', cidade: '' },

      initMagistrados() {
        ['magistradoSearch', 'magistradosSortBy', 'magistradosSortDir'].forEach(w => {
          this.$watch(w, () => { this.magistradosPage = 1; this.$nextTick(() => lucide.createIcons()); });
        });
        this.$watch('magistradosPage',    () => { this.$nextTick(() => lucide.createIcons()); });
        this.$watch('magistradosPerPage', () => { this.$nextTick(() => lucide.createIcons()); });

          if (e.detail.viewId === 'magistrados' && !this.composicaoLoaded) this.loadComposicao('Carregando magistrados...');

      },

      openViewMagistrado(magistrado) {
        this.viewMagistrado = { ...magistrado };
        this.openModal({ title: 'Detalhes do Magistrado', size: 'sm', contentKey: 'viewMagistrado', showConfirm: false, cancelLabel: 'Fechar' });
        this.$nextTick(() => lucide.createIcons());
      },

      openAddMagistrado() {
        this.novoMagistrado = { nome: '', matricula: '', cidade: '' };
        this.openModal({ title: 'Novo Magistrado', size: 'sm', contentKey: 'addMagistrado', confirmLabel: 'Criar', onConfirm: () => this.saveAddMagistrado() });
      },

      saveAddMagistrado() {
        Loading.show('Salvando magistrado...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              this.magistrados.push(res.data);
              this.closeModal();
              Toast.success('Magistrado criado com sucesso.');
              this.$nextTick(() => lucide.createIcons());
            } else Toast.error(res.message);
          })
          .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
          .magistradoCreate(this.novoMagistrado);
      },

      openEditMagistrado(magistrado) {
        this.editMagistrado = { ...magistrado };
        this.openModal({ title: 'Editar Magistrado', size: 'sm', contentKey: 'editMagistrado', confirmLabel: 'Salvar', onConfirm: () => this.saveEditMagistrado() });
      },

      saveEditMagistrado() {
        Loading.show('Salvando magistrado...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              const idx = this.magistrados.findIndex(m => m.id === this.editMagistrado.id);
              if (idx !== -1) this.magistrados[idx] = res.data;
              this.closeModal();
              Toast.success('Magistrado atualizado com sucesso.');
              this.$nextTick(() => lucide.createIcons());
            } else Toast.error(res.message);
          })
          .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
          .magistradoUpdate(this.editMagistrado.id, this.editMagistrado);
      },

      deleteMagistrado(magistrado) {
        this.showConfirm({
          message: 'Excluir magistrado?',
          detail: `O magistrado '${magistrado.nome}' será removido permanentemente.`,
          confirmLabel: 'Excluir',
          variant: 'danger',
          onConfirm: () => {
            Loading.show('Excluindo magistrado...');
            google.script.run
              .withSuccessHandler((res) => {
                Loading.hide();
                if (res.status === 'success') {

      _maskCpf(value) {
        if (!value) return '';
        return String(value).replace(/\D/g, '').substring(0, 11)
          .replace(/(\d{3})(\d)/, '$1.$2')
          .replace(/(\d{3})(\d)/, '$1.$2')
          .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      },

      _maskPhone(value) {
        if (!value) return '';
        const d = String(value).replace(/\D/g, '').substring(0, 11);
        if (d.length <= 10) {
          return d.replace(/(\d{2})(\d)/, '($1) $2').replace(/(\d{4})(\d{1,4})$/, '$1-$2');
        }
        return d.replace(/(\d{2})(\d)/, '($1) $2').replace(/(\d{5})(\d{1,4})$/, '$1-$2');
      },

      _formatDate(value) {
        if (!value) return '';
        const parts = String(value).split('-');
        if (parts.length !== 3) return value;
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      },

      _stripMask(value) {
        return value ? String(value).replace(/\D/g, '') : '';
      },

      _isValidCpf(value) {
        const d = String(value || '').replace(/\D/g, '');
        if (!/^\d{11}$/.test(d)) return false;
        if (/^(\d)\1{10}$/.test(d)) return false;
        const calc = (base, fator) => {
          let total = 0;
          for (let i = 0; i < base.length; i++) total += parseInt(base[i], 10) * fator--;
          const r = total % 11;
          return r < 2 ? 0 : 11 - r;
        };
        const base9 = d.substring(0, 9);
        const d1 = calc(base9, 10);
        const d2 = calc(base9 + d1, 11);
        return d === base9 + d1.toString() + d2.toString();
      },

      _isValidPhone(value) {
        if (!value || String(value).trim() === '') return true;
        const d = String(value).replace(/\D/g, '');
        return d.length === 10 || d.length === 11;
      },

      _agora() {
        return new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
      },
    };
  }

      },

      contratoTiposParaVaga(idVaga) {
        const todos = [
          { value: 'graduacao',    label: 'Graduação' },
          { value: 'pos_graduacao', label: 'Pós-Graduação' },
        ];
        if (!idVaga) return todos;
        const vaga = this.vagas.find(v => String(v.id) === String(idVaga));
        if (!vaga || vaga.tipo_vaga === 'indefinido') return todos;
        return todos.filter(t => t.value === vaga.tipo_vaga);
      },

      contratoOnVagaChange(modo) {
        const obj = modo === 'novo' ? this.novoContrato : this.editContrato;
        const tipos = this.contratoTiposParaVaga(obj.id_vaga);
        obj.tipo_contrato = tipos.length === 1 ? tipos[0].value : '';
        this.contratoSugerirDataFim(modo);
      },

      contratoStatus(c) {
        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);
        const inicio = new Date(c.data_inicio);
        const fim    = new Date(c.data_fim);
        if (inicio > hoje) return 'Não iniciado';
        if (fim >= hoje)   return 'Ativo';
        return 'Encerrado';
      },

      contratoDataFormatada(d) {
        if (!d) return '—';
        const dt = new Date(d);
        if (isNaN(dt.getTime())) return String(d);
        return dt.toLocaleDateString('pt-BR', { timeZone: 'UTC' });
      },

      contratoSugerirDataFim(modo) {
        const obj = modo === 'novo' ? this.novoContrato : this.editContrato;
        if (!obj.data_inicio || !obj.tipo_contrato) return;
        const meses = obj.tipo_contrato === 'graduacao' ? 24 : 12;
        const inicio = new Date(obj.data_inicio);
        if (isNaN(inicio.getTime())) return;
        const sugerida = new Date(inicio);
        sugerida.setMonth(sugerida.getMonth() + meses);
        const sugeridaStr = sugerida.toISOString().split('T')[0];
        if (!obj.data_fim || obj.data_fim === this._contratoDataFimSugerida) {
          obj.data_fim = sugeridaStr;
          this._contratoDataFimSugerida = sugeridaStr;
        }
      },

      openAddContrato() {
        this.novoContrato = { id_estagiario: '', id_vaga: '', tipo_contrato: '', data_inicio: '', data_fim: '' };
        this._contratoDataFimSugerida = '';
        this.openModal({ title: 'Novo Contrato', size: 'md', contentKey: 'addContrato', confirmLabel: 'Criar', onConfirm: () => this.saveAddContrato() });
      },

      saveAddContrato() {
        if (!this.novoContrato.id_estagiario) return Toast.warning('Selecione um estagiário.');
        if (!this.novoContrato.id_vaga)       return Toast.warning('Selecione uma vaga.');
        if (!this.novoContrato.tipo_contrato) return Toast.warning('Selecione o tipo de contrato.');
        if (!this.novoContrato.data_inicio)   return Toast.warning('Informe a data de início.');
        if (!this.novoContrato.data_fim)      return Toast.warning('Informe a data de fim.');
        Loading.show('Salvando contrato...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              this.contratos.push(res.data);
              this._recalcularDashboard();
              this.closeModal();
              Toast.success('Contrato criado com sucesso.');
              this.$nextTick(() => lucide.createIcons());
            } else Toast.error(res.message);
          })
          .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
          .contratoCreate(this.novoContrato);
      },

      openEditContrato(c) {
        this.editContrato = { ...c };
        this._contratoDataFimSugerida = '';
        this.openModal({ title: 'Editar Contrato', size: 'md', contentKey: 'editContrato', confirmLabel: 'Salvar', onConfirm: () => this.saveEditContrato() });
      },

      saveEditContrato() {
        if (!this.editContrato.tipo_contrato) return Toast.warning('Selecione o tipo de contrato.');
        if (!this.editContrato.data_inicio)   return Toast.warning('Informe a data de início.');
        if (!this.editContrato.data_fim)      return Toast.warning('Informe a data de fim.');
        Loading.show('Salvando contrato...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              const idx = this.contratos.findIndex(ct => ct.id === this.editContrato.id);
              if (idx !== -1) this.contratos[idx] = res.data;
              this._recalcularDashboard();
              this.closeModal();
              Toast.success('Contrato atualizado com sucesso.');
              this.$nextTick(() => lucide.createIcons());
            } else Toast.error(res.message);
          })
          .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
          .contratoUpdate(this.editContrato.id, this.editContrato);
      },

      deleteContrato(c) {
        const nome = this.contratoEstagiarioNome(c);
        this.showConfirm({
          message:      'Excluir contrato?',
          detail:       `O contrato de '${nome}' será removido permanentemente.`,
          confirmLabel: 'Excluir',
          variant:      'danger',
          onConfirm: () => {
            Loading.show('Excluindo contrato...');
            google.script.run
              .withSuccessHandler((res) => {
                Loading.hide();
                if (res.status === 'success') {
                  this.contratos = this.contratos.filter(ct => ct.id !== c.id);
                  this._recalcularDashboard();
                  Toast.success('Contrato excluído com sucesso.');
                  this.$nextTick(() => lucide.createIcons());
                } else Toast.error(res.message);
              })
              .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
              .contratoDelete(c.id);
          },
        });
      },

      _agora() {
        return new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
      },
    };
  }

  function dashboardModule() {
    return {
      dashboard:                null,
      dashboardLoaded:          false,
      dashboardUltimaConsulta:  null,

      initDashboard() {
        this.loadDashboard();
        window.addEventListener('app:navigate', (e) => {
          if (e.detail.viewId === 'dashboard' && !this.dashboardLoaded) this.loadDashboard();
        });
      },

      loadDashboard() {
        Loading.show('Carregando dashboard...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              this.dashboard               = res.data;
              this.dashboardLoaded         = true;
              this.dashboardUltimaConsulta = new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
              this.alertasCount = (this.dashboard.contratosVencendo30d ?? 0) + (this.dashboard.contratosVencendo60d ?? 0);
              this._buildNavItems();
            } else {
              Toast.error(res.message);
            }
            this.$nextTick(() => lucide.createIcons());
          })
          .withFailureHandler((err) => { Loading.hide(); Toast.error(err.message); })
          .getDashboardData();
      },

      dashboardPct(valor) {
        const total = this.dashboard?.totalVagas ?? 0;
        if (total === 0) return '0.00';
        return (valor / total * 100).toFixed(2);
      },

      _recalcularDashboard() {
        if (!this.dashboardLoaded || (!this.vagasLoaded && !this.contratosLoaded)) return;
        const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
        const d30  = new Date(hoje); d30.setDate(d30.getDate() + 30);
        const d60  = new Date(hoje); d60.setDate(d60.getDate() + 60);

        const totalVagas           = this.vagas.length;
        const vagasOcupadas        = this.contratos.filter(c => {
          const ini = new Date(c.data_inicio); ini.setHours(0, 0, 0, 0);
          const fim = new Date(c.data_fim);    fim.setHours(0, 0, 0, 0);
          return ini <= hoje && fim >= hoje;
        }).length;
        const vagasOciosas         = totalVagas - vagasOcupadas;
        const vagasAlocadasOrgao   = this.vagas.filter(v => v.id_cargo).length;
        const vagasAlocadasSetor   = this.vagas.filter(v => v.status === 'alocada' && !v.id_cargo).length;
        const contratosVencendo30d = this.contratos.filter(c => {
          const ini = new Date(c.data_inicio); ini.setHours(0, 0, 0, 0);
          const fim = new Date(c.data_fim);    fim.setHours(0, 0, 0, 0);
          return ini <= hoje && fim >= hoje && fim <= d30;
        }).length;
        const contratosVencendo60d = this.contratos.filter(c => {
          const ini = new Date(c.data_inicio); ini.setHours(0, 0, 0, 0);
          const fim = new Date(c.data_fim);    fim.setHours(0, 0, 0, 0);
          return ini <= hoje && fim >= hoje && fim > d30 && fim <= d60;
        }).length;
        const vagasGraduacao       = this.vagas.filter(v => v.tipo_vaga === 'graduacao').length;
        const vagasPosGraduacao    = this.vagas.filter(v => v.tipo_vaga === 'pos_graduacao').length;
        const vagasIndefinidas     = this.vagas.filter(v => v.tipo_vaga === 'indefinido').length;

        this.dashboard = {
          ...this.dashboard,
          totalVagas,
          vagasOcupadas,
          vagasOciosas,
          vagasAlocadasOrgao,
          vagasAlocadasSetor,
          contratosVencendo30d,
          contratosVencendo60d,
          vagasGraduacao,
          vagasPosGraduacao,
          vagasIndefinidas,
        };
        this.alertasCount = this.alertasVencendo30.length + this.alertasVencendo60.length;
        this._buildNavItems();
      },
    };
  }

  function alertasModule() {
    return {
      alertasLoaded:         false,
      alertasUltimaConsulta: null,
      alertasFiltroTipo:     '',
      alertasPage:           1,

          if (e.detail.viewId === 'alertas' && (!this.alertasLoaded || !this.contratosLoaded)) this.loadAlertas();

        if (this.contratosLoaded) {
          this.alertasLoaded         = true;
          this.alertasUltimaConsulta = this._agora();
          this.$nextTick(() => lucide.createIcons());
          return;
        }
        Loading.show('Carregando alertas...');
        google.script.run
          .withSuccessHandler((res) => {
            Loading.hide();
            if (res.status === 'success') {
              const c = res.data.collections;
              this.contratos             = c.contratos   || [];
              this.estagiosList          = c.estagiarios || [];
              this.vagas                 = c.vagas        || [];
              this.setores               = c.setores      || [];

              this.alertasLoaded             = true;

      irParaContrato(c) {

      setAlertaFiltro(tipo) {

  function app() {
    return {
      ...dashboardModule(),
      ...composicaoModule(),
      ...magistradosModule(),
      ...estagiariosModule(),
      ...vagasModule(),
      ...contratosModule(),
      ...alertasModule(),
      ...configuracaoModule(),
      ...usersModule(),
      ...modalModule(),
      ...navigationModule(),

      userEmail:    DATA.userEmail,
      userInitial:  DATA.userEmail.charAt(0).toUpperCase(),
      userRole:     DATA.userRole,
      alertasCount: 0,
      alertasMuted: DATA.alertasMuted || false,

      init() {
        this._buildNavItems();
        this.initDashboard();
        this.initUsers();
        this.initComposicao();
        this.initMagistrados();
        this.initEstagiarios();
        this.initVagas();
        this.initContratos();
        this.initAlertas();
        this.initConfiguracao();
        this.$nextTick(() => {
          lucide.createIcons();
          Sidebar.init();
        });
      },

      canEdit()  { return [ROLES.ADMIN, ROLES.EDITOR].includes(this.userRole); },
      canAdmin() { return this.userRole === ROLES.ADMIN; },

      toggleAlertasMuted() {
        this.alertasMuted = !this.alertasMuted;
        const item = this.navItems.find(i => i.id === 'alertas');
        if (item) item.badge = this.alertasMuted ? null : this.badgeLabel(this.alertasCount);
        google.script.run
          .withSuccessHandler(() => {})
          .withFailureHandler(() => {
            this.alertasMuted = !this.alertasMuted;
            if (item) item.badge = this.alertasMuted ? null : this.badgeLabel(this.alertasCount);
            Toast.error('Falha ao salvar preferência.');
          })
          .setAlertasMuted(this.alertasMuted);
      },

      roleLabel(role) { return ROLES.label(role); },
      badgeLabel(count) { return count > 99 ? '99+' : count; },
      roleBadgeClass(role) { return ROLES.badgeClass(role); },
      roleBadgeLabel(role) { return ROLES.badgeLabel(role); },

      get usersFiltered() {
        const term    = this.userSearch.toLowerCase().trim();
        const role    = this.userRoleFilter;
        const sortBy  = this.usersSortBy;
        const sortDir = this.usersSortDir;

        const result = this.users.filter(u => {
          if (role && u.role !== role) return false;
          if (term && !u.email.toLowerCase().includes(term)) return false;
          return true;
        });

        result.sort((a, b) => {
          const va = String(a[sortBy] ?? '').toLowerCase();
          const vb = String(b[sortBy] ?? '').toLowerCase();
          return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        });

        return result;
      },
      get usersTotalPages() {
        return ListUtils.totalPages(this.usersFiltered.length, this.usersPerPage);
      },
      get usersPaged() {
        return ListUtils.paged(this.usersFiltered, this.usersPage, this.usersPerPage);
      },

      get gruposFiltrados() {
        const term = this.composicaoSearch.toLowerCase().trim();
        return this.grupos.filter(g => !term || g.nome.toLowerCase().includes(term));
      },
      get orgaosDoGrupo() {
        if (!this.selectedGrupo) return [];
        return this.orgaos.filter(o => String(o.id_grupo) === String(this.selectedGrupo.id));
      },
      get cargosDoOrgao() {
        if (!this.selectedOrgao) return [];
        return this.cargos.filter(c => String(c.id_orgao) === String(this.selectedOrgao.id));
      },
      get magistradosFiltrados() {
        const term    = this.magistradoSearch.toLowerCase().trim();
        const sortBy  = this.magistradosSortBy;
        const sortDir = this.magistradosSortDir;

        const result = this.magistrados.filter(m =>
          !term || ['nome', 'matricula'].some(f => String(m[f] ?? '').toLowerCase().includes(term))
        );

        result.sort((a, b) => {
          const va = String(a[sortBy] ?? '').toLowerCase();
          const vb = String(b[sortBy] ?? '').toLowerCase();
          return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        });

        return result;
      },
      get magistradosTotalPages() {
        return ListUtils.totalPages(this.magistradosFiltrados.length, this.magistradosPerPage);
      },
      get magistradosPaged() {
        return ListUtils.paged(this.magistradosFiltrados, this.magistradosPage, this.magistradosPerPage);
      },

      get estagiosFiltrados() {
        const term    = this.estagiariosSearch.toLowerCase().trim();
        const sortBy  = this.estagiosSortBy;
        const sortDir = this.estagiosSortDir;

        const result = this.estagiosList.filter(e => {
          if (!term) return true;
          return ['nome', 'email', 'matricula'].some(f => String(e[f] ?? '').toLowerCase().includes(term));
        });

        result.sort((a, b) => {
          const va = String(a[sortBy] ?? '').toLowerCase();
          const vb = String(b[sortBy] ?? '').toLowerCase();
          return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        });

        return result;
      },
      get estagiosTotalPages() {
        return ListUtils.totalPages(this.estagiosFiltrados.length, this.estagiariosPerPage);
      },
      get estagiosPaged() {
        return ListUtils.paged(this.estagiosFiltrados, this.estagiariosPage, this.estagiariosPerPage);
      },

      get contratosFiltrados() {
        const term    = this.contratosSearch.toLowerCase().trim();
        const status  = this.contratosFiltroStatus;
        const tipo    = this.contratosFiltroTipo;
        const sortBy  = this.contratosSortBy;
        const sortDir = this.contratosSortDir;

        const result = this.contratos.filter(c => {
          if (tipo   && c.tipo_contrato !== tipo)           return false;
          if (status && this.contratoStatus(c) !== status)  return false;
          if (term) {
            const nome   = this.contratoEstagiarioNome(c).toLowerCase();
            const codigo = this.contratoVagaCodigo(c).toLowerCase();
            if (!nome.includes(term) && !codigo.includes(term)) return false;
          }
          return true;
        });

        result.sort((a, b) => {
          let va, vb;
          if (sortBy === 'estagiario') {
            va = this.contratoEstagiarioNome(a).toLowerCase();
            vb = this.contratoEstagiarioNome(b).toLowerCase();
            return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
          }
          va = String(a[sortBy] ?? '');
          vb = String(b[sortBy] ?? '');
          return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        });

        return result;
      },
      get contratosTotalPages() {
        return ListUtils.totalPages(this.contratosFiltrados.length, this.contratosPerPage);
      },
      get contratosPaged() {
        return ListUtils.paged(this.contratosFiltrados, this.contratosPage, this.contratosPerPage);
      },

      get vagasFiltradas() {
        const term   = this.vagasSearch.toLowerCase().trim();
        const tipo   = this.vagasFiltroTipo;
        const status = this.vagasFiltroStatus;
        const sortBy = this.vagasSortBy;
        const sortDir = this.vagasSortDir;

        const result = this.vagas.filter(v => {
          if (tipo   && v.tipo_vaga !== tipo)   return false;
          if (status && v.status   !== status)  return false;
          if (term) {
            const codigo     = this.vagaCodigo(v).toLowerCase();
            const estagiario = (this.vagaEstagiario(v) || '').toLowerCase();
            const lotacao    = (this.vagaLotacao(v) ? (this.vagaLotacao(v).linha1 + ' ' + (this.vagaLotacao(v).linha2 || '')) : '').toLowerCase();
            if (!codigo.includes(term) && !estagiario.includes(term) && !lotacao.includes(term)) return false;
          }
          return true;
        });

        result.sort((a, b) => {
          let va = '', vb = '';
          if (sortBy === 'codigo') {
            va = this.vagaCodigo(a);
            vb = this.vagaCodigo(b);
          } else if (sortBy === 'estagiario') {
            va = this.vagaEstagiario(a) || '';
            vb = this.vagaEstagiario(b) || '';
          }
          const vaVazio = !va || va === '—';
          const vbVazio = !vb || vb === '—';
          if (vaVazio && vbVazio) return 0;
          if (vaVazio) return 1;
          if (vbVazio) return -1;
          const cmp = va.localeCompare(vb, 'pt-BR', { sensitivity: 'base' });
          return sortDir === 'asc' ? cmp : -cmp;
        });

        return result;
      },
      get vagasTotalPages() {
        return ListUtils.totalPages(this.vagasFiltradas.length, this.vagasPerPage);
      },
      get vagasPaged() {
        return ListUtils.paged(this.vagasFiltradas, this.vagasPage, this.vagasPerPage);
      },

      get alertasVencendo30() {
        const hoje  = new Date(); hoje.setHours(0, 0, 0, 0);
        const limite = new Date(hoje); limite.setDate(limite.getDate() + 30);
        return this.contratos
          .filter(c => {
            const inicio = new Date(c.data_inicio); inicio.setHours(0, 0, 0, 0);
            const fim    = new Date(c.data_fim);    fim.setHours(0, 0, 0, 0);
            return inicio <= hoje && fim >= hoje && fim <= limite;
          })
          .sort((a, b) => new Date(a.data_fim) - new Date(b.data_fim));
      },
      get alertasVencendo60() {
        const hoje   = new Date(); hoje.setHours(0, 0, 0, 0);
        const de31   = new Date(hoje); de31.setDate(de31.getDate() + 31);
        const limite = new Date(hoje); limite.setDate(limite.getDate() + 60);
        return this.contratos
          .filter(c => {
            const inicio = new Date(c.data_inicio); inicio.setHours(0, 0, 0, 0);
            const fim    = new Date(c.data_fim);    fim.setHours(0, 0, 0, 0);
            return inicio <= hoje && fim >= hoje && fim >= de31 && fim <= limite;
          })
          .sort((a, b) => new Date(a.data_fim) - new Date(b.data_fim));
      },
      get alertasVagasOciosas() {
        return this.vagas.filter(v => v.status === 'nao_alocada');
      },
      get alertasFiltrados() {
        const tipo = this.alertasFiltroTipo;
        if (tipo === '30d')     return this.alertasVencendo30.map(c => ({ _tipo: '30d',    ...c }));
        if (tipo === '60d')     return this.alertasVencendo60.map(c => ({ _tipo: '60d',    ...c }));
        if (tipo === 'ociosas') return this.alertasVagasOciosas.map(v => ({ _tipo: 'ociosa', ...v }));
        return [
          ...this.alertasVencendo30.map(c => ({ _tipo: '30d',    ...c })),
          ...this.alertasVencendo60.map(c => ({ _tipo: '60d',    ...c })),
          ...this.alertasVagasOciosas.map(v => ({ _tipo: 'ociosa', ...v })),
        ];
      },
      get alertasTotalPages() {
        return ListUtils.totalPages(this.alertasFiltrados.length, this.alertasPerPage);
      },
      get alertasPaged() {
        return ListUtils.paged(this.alertasFiltrados, this.alertasPage, this.alertasPerPage);
      },
    };
  }

  function lucideIcon(name, size = 18) {
    return `<i data-lucide="${name}" style="width:${size}px;height:${size}px;display:block;"></i>`;
  }

  const Sidebar = {
    el: null, overlay: null,
    toggleBtn: null, mobileBtn: null, mobileCloseBtn: null,
    _expanded: true,

    init() {
      this.el             = document.getElementById('sidebar');
      this.overlay        = document.getElementById('mobile-overlay');
      this.toggleBtn      = document.getElementById('sidebar-toggle');
      this.mobileBtn      = document.getElementById('mobile-menu-btn');
      this.mobileCloseBtn = document.getElementById('mobile-close-btn');

      const saved    = localStorage.getItem('app_sidebar_expanded');
      this._expanded = saved === null ? true : saved === 'true';

      if (window.innerWidth >= 768) this._applyDesktop(this._expanded, false);

      this.toggleBtn?.addEventListener('click', () => {
        this._expanded = !this._expanded;
        localStorage.setItem('app_sidebar_expanded', this._expanded);
        this._applyDesktop(this._expanded, true);
      });

      this.mobileBtn?.addEventListener('click',      () => this._setMobileOpen(true));
      this.mobileCloseBtn?.addEventListener('click', () => this._setMobileOpen(false));
      this.overlay?.addEventListener('click',        () => this._setMobileOpen(false));

      window.addEventListener('resize', () => {
        if (window.innerWidth >= 768) {
          this._setMobileOpen(false);
          this._applyDesktop(this._expanded, false);
        } else {
          this.el.classList.remove('sidebar-collapsed', 'sidebar-expanded');
        }
      });

      window.addEventListener('app:navigate', () => this._setMobileOpen(false));

      requestAnimationFrame(() => requestAnimationFrame(() => this._initTippy()));
    },

    _applyDesktop(expanded, animate) {
      if (window.innerWidth < 768) return;

      if (!animate) {
        this.el.style.transition = 'none';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          this.el.style.transition = '';
        }));
      }

      const texts = this.el.querySelectorAll('.sidebar-text');

      if (expanded) {
        this.el.classList.remove('sidebar-collapsed');
        this.el.classList.add('sidebar-expanded');
        texts.forEach(t => t.classList.remove('sidebar-text-hidden'));
        if (this.toggleBtn) this.toggleBtn.title = 'Recolher menu';
      } else {
        this.el.classList.add('sidebar-collapsed');
        this.el.classList.remove('sidebar-expanded');
        texts.forEach(t => t.classList.add('sidebar-text-hidden'));
        if (this.toggleBtn) this.toggleBtn.title = 'Expandir menu';
      }

      this._updateTippy(expanded);
    },

    _initTippy() {
      const instances = tippy(this.el.querySelectorAll('.nav-item'), {
        content:   (el) => el.dataset.tippyLabel || '',
        placement: 'right',
        theme:     'sidebar',
        onShow:    () => this.el.classList.contains('sidebar-collapsed'),
      });
      this._tippyInstances = [].concat(instances);
    },

    _updateTippy(expanded) {
      if (!this._tippyInstances?.length) return;
      this._tippyInstances.forEach(instance => {
        expanded ? instance.disable() : instance.enable();
      });
    },

    _setMobileOpen(open) {
      if (!this.el || !this.overlay) return;
      if (open) {
        this.el.classList.add('mobile-open');
        this.overlay.classList.remove('hidden');
        setTimeout(() => this.overlay.classList.remove('opacity-0'), 10);
      } else {
        this.el.classList.remove('mobile-open');
        this.overlay.classList.add('opacity-0');
        setTimeout(() => this.overlay.classList.add('hidden'), 300);
      }
    },
  };

  const Loading = {
    _overlay: null,
    _message: null,

    _getElements() {
      if (!this._overlay) this._overlay = document.getElementById('loading-overlay');
      if (!this._message) this._message = document.getElementById('loading-message');
    },

    show(message = 'Aguarde...') {
      this._getElements();
      this._message.textContent = message;
      this._overlay.classList.add('active');
    },

    hide() {
      this._getElements();
      this._overlay.classList.remove('active');
    },
  };

  const Toast = {
    _container: null,

    _getContainer() {
      if (!this._container) this._container = document.getElementById('toast-container');
      return this._container;
    },

    _sanitize(str) {
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    },

    show(message, type = 'info', duration = 4000) {
      const icons = {
        success: 'check-circle',
        error:   'x-circle',
        warning: 'alert-triangle',
        info:    'info',
      };

      const t   = ['success','error','warning','info'].includes(type) ? type : 'info';
      const pfx = `--toast-${t}`;
      const cs  = getComputedStyle(document.documentElement);
      const c   = {
        bg:        cs.getPropertyValue(`${pfx}-bg`).trim(),
        border:    cs.getPropertyValue(`${pfx}-border`).trim(),
        iconColor: cs.getPropertyValue(`${pfx}-icon`).trim(),
        bar:       cs.getPropertyValue(`${pfx}-border`).trim(),
        icon:      icons[t],
      };
      const id = `toast-${Date.now()}`;
      const el = document.createElement('div');

      el.id        = id;
      el.className = 'toast-item toast-enter';
      el.style.cssText = `background:${c.bg}; border:1px solid ${c.border};`;
      const safeMessage = this._sanitize(message);
      el.innerHTML = `
        <div style="padding:0.875rem 1rem; display:flex; align-items:flex-start; gap:0.625rem;">
          <i data-lucide="${c.icon}" style="width:18px;height:18px;color:${c.iconColor};flex-shrink:0;margin-top:1px;"></i>
          <p style="font-size:0.875rem;color:#2D3748;flex:1;margin:0;">${safeMessage}</p>
          <button class="toast-close">
            <i data-lucide="x" style="width:14px;height:14px;color:#718096;"></i>
          </button>
        </div>
        <div class="toast-progress-track">
          <div class="toast-progress-bar running" style="background:${c.bar};--toast-duration:${duration}ms;"></div>
        </div>`;

      el.querySelector('.toast-close').addEventListener('click', () => this._dismiss(id));

      this._getContainer().appendChild(el);
      lucide.createIcons({ nodes: el.querySelectorAll('[data-lucide]') });

      const bar = el.querySelector('.toast-progress-bar');

      let remaining = duration;
      let startedAt = Date.now();
      let timer     = setTimeout(() => this._dismiss(id), remaining);

      el.addEventListener('mouseenter', () => {
        clearTimeout(timer);
        remaining -= Date.now() - startedAt;
        bar?.classList.add('paused');
      });

      el.addEventListener('mouseleave', () => {
        startedAt = Date.now();
        timer = setTimeout(() => this._dismiss(id), remaining);
        bar?.classList.remove('paused');
      });
    },

    _dismiss(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('toast-enter');
      el.classList.add('toast-exit');
      setTimeout(() => el.remove(), 280);
    },

    success: (msg, ms) => Toast.show(msg, 'success', ms),
    error:   (msg, ms) => Toast.show(msg, 'error',   ms),
    warning: (msg, ms) => Toast.show(msg, 'warning', ms),
    info:    (msg, ms) => Toast.show(msg, 'info',    ms),
  };
</script>
