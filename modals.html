                x-text="viewVaga.status === 'alocada' ? 'Alocada' : 'Não alocada'">
          </span>
        </div>
        <div>
          <p class="text-xs font-semibold text-text-muted uppercase tracking-wide mb-0.5">Estagiário</p>
          <p class="text-sm text-text-main" x-text="vagaEstagiario(viewVaga) || '—'"></p>
        </div>
      </div>
      <div>
        <p class="text-xs font-semibold text-text-muted uppercase tracking-wide mb-1">Lotação</p>
        <template x-if="!vagaLotacao(viewVaga)">
          <p class="text-sm text-text-muted">Não alocada</p>
        </template>
        <template x-if="vagaLotacao(viewVaga)">
          <div>
            <p class="text-sm font-medium text-text-main" x-text="vagaLotacao(viewVaga).linha1"></p>
            <p class="text-sm text-text-muted" x-show="vagaLotacao(viewVaga).linha2" x-text="vagaLotacao(viewVaga).linha2"></p>
          </div>
        </template>
      </div>
      <template x-if="viewVaga.descricao">
        <div>
          <p class="text-xs font-semibold text-text-muted uppercase tracking-wide mb-0.5">Descrição</p>
          <p class="text-sm text-text-main whitespace-pre-wrap" x-text="viewVaga.descricao"></p>
        </div>
      </template>
    </div>
  </template>
